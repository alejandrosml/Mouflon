[package]
name = "mouflon-platform"
description = "Couche système de Mouflon : fenêtres des autres apps, écrans, curseur. Seul crate autorisé à contenir de l'unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
raw-window-handle.workspace = true

# Ressources du processus (essais).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSGeometry", "NSArray", "NSThread", "NSURL", "NSLocale", "NSAttributedString", "NSDictionary", "NSObject", "NSData", "NSRunLoop", "NSKeyValueObserving"] }
objc2-app-kit = { workspace = true, features = [
    "libc",
    "NSScreen",
    "NSWorkspace",
    "NSRunningApplication",
    "NSEvent",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSGraphics",
    "NSPanel",
    # Fenêtre « À propos » et bulle d'explication.
    "NSApplication",
    "NSAlert",
    "NSAttributedString",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSParagraphStyle",
    "NSPopover",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSViewController",
    # Sons des animaux.
    "NSSound",
    # Horloge de l'écran (CADisplayLink).
    "objc2-quartz-core",
] }
objc2-quartz-core = { workspace = true, features = ["std", "objc2-core-foundation", "CADisplayLink", "CAFrameRateRange", "CALayer"] }
objc2-core-graphics = { workspace = true, features = ["CGWindow", "CGGeometry"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFDictionary", "CFNumber", "CFString", "CFBase", "CFCGTypes"] }
# Accessibilité : la place exacte du Dock (avec l'autorisation de l'utilisateur).
objc2-application-services = { workspace = true, features = ["std", "libc", "HIServices", "AXError", "AXUIElement", "AXValue"] }

# Ce crate n'hérite pas du `forbid(unsafe_code)` du workspace : c'est la
# frontière avec le système. Chaque bloc unsafe y est commenté.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
