[workspace]
resolver = "3"
members = [
    "crates/mouflon-core",
    "crates/mouflon-render",
    "crates/mouflon-platform",
    "crates/mouflon-app",
    "tools/mouflon-preview",
    "tools/mouflon-licenses",
]
default-members = ["crates/mouflon-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Alejandro San Martin Lamas"]
description = "A light and beautiful desktop companion manager. Un gestionnaire de compagnons de bureau, léger et beau."
repository = "https://github.com/alejandrosml/Mouflon"
homepage = "https://github.com/alejandrosml/Mouflon"
keywords = ["desktop-pet", "esheep", "desktoppet", "macos", "companion"]
categories = ["gui", "games"]

[workspace.dependencies]
mouflon-core = { path = "crates/mouflon-core" }
mouflon-render = { path = "crates/mouflon-render" }
mouflon-platform = { path = "crates/mouflon-platform" }

serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
serde_json = "1.0"
roxmltree = "0.21"
base64 = "0.23"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

vello = "0.11"
usvg = "0.49"
resvg = "0.49"
png = "0.18"
# Cuisson des dessins vectoriels en images (même version que resvg).
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# Décodeur BC7 indépendant du nôtre, pour vérifier le codeur (tests).
bcdec_rs = "0.2.1"

winit = "0.30.13"
pollster = "1.0"
directories = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.26"
muda = "0.21"

objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-application-services = { version = "0.3", default-features = false }
objc2-quartz-core = { version = "0.3", default-features = false }
objc2-service-management = { version = "0.3", default-features = false }
raw-window-handle = "0.6"
libc = "0.2.191"

# Tout le code du projet interdit `unsafe`, sauf le crate `mouflon-platform`
# qui ne reprend pas ces lints et isole les appels au système.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Les noms des fonctions restent dans le programme (pas leurs détails de
# débogage) : les rapports de plantage de macOS, `sample` et les piles
# relevées pendant les essais disent où l'on était (≈ +2 Mo).
strip = "debuginfo"

[profile.profilage]
# La version publiée, mais avec ses symboles : pour relever où passe le temps
# de calcul (`sample` de macOS, dans la CI).
inherits = "release"
strip = false
debug = "line-tables-only"

[profile.dev.package."*"]
# Les dépendances (Vello, wgpu…) restent rapides même en debug.
opt-level = 2

[profile.dev.package.mouflon-render]
# Décoder et réduire des centaines d'images reste rapide même en debug.
opt-level = 2
