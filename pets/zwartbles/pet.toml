# Zwartbles : une brebis adulte de trois à quatre ans, 80 cm au garrot,
# au début de l'automne, trois à quatre mois après la tonte : 4 à 6 cm
# de laine noire chocolat (docs/races/zwartbles.md). Le comportement reprend
# tous ceux du Mannequin, réglés sur la fiche (§ 8) : calme, curieuse,
# facile à mener, elle regarde et renifle plus souvent qu'elle ne fuit,
# suit volontiers ses voisines et broute longuement. Les jeux d'agneaux
# restent possibles chez les actives, les combats et le flehmen sont rares.

[pet]
id = "zwartbles"
name = "Zwartbles"
author = "Alejandro San Martin Lamas"
description = "La Zwartbles de Frise : grande brebis noire chocolat, longue tête nue à liste blanche, quatre balzanes, longue queue au bout blanc. Sans cornes, grandes oreilles noires, calme et curieuse."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "zwartbles.svg"
# Une unité = un centimètre ; 0,5 point par cm : 80 cm au garrot,
# 85 cm laine comprise, 102,94 cm du sol au haut du dessin visible.
height = 51.5          # 0,5 × 102,94 cm, arrondi au dixième de point

[physics]
width = 67.0          # fesse → nez : 133,96 cm visibles, queue exclue
stride = 42.4         # 1,6 × la patte de 53 cm, affichée à 0,5 pt/cm

# Les sons du Mannequin (domaine public, voir CREDITS.md). Aucune voix propre
# au Zwartbles n’est documentée (§ 8.3) ; pas de sonnaille.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Docile et curieuse : un clic la fait regarder ou renifler avant de fuir.
poke = [
    { to = "look", weight = 6 },
    { to = "sniff", weight = 3 },
    { to = "bleat", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "stamp", weight = 1, when = "rowdy" },
]
window_side = "turn"
# Deux brebis qui se croisent se reniflent ; les jeunes jouent parfois.
meet = [
    { to = "sniff", weight = 5 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 1, when = "lively" },
]
together = "pronk"
leave = "hop"
# Peu craintive : le pointeur qui file lui fait surtout lever la tête.
startle = [
    { to = "look", weight = 7 },
    { to = "sniff", weight = 2 },
    { to = "run", weight = 0.5 },
    { to = "stamp", weight = 0.5 },
    { to = "hop", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Rustique en climat froid, humide et venteux : elle tourne le dos au vent.
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [2.0, 5.0]
next = [
    { to = "walk", weight = 6 },
    # Au pâturage, elle broute longtemps et avance d’un pas entre les bouchées.
    { to = "graze", weight = 8 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 3 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 0.5, when = "lively" },
    { to = "hop", weight = 1, when = "lively" },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 6, when = "cursor_near:160" },
    { to = "sniff", weight = 3, when = "cursor_near:100" },
    # Une brebis calme gratte rarement le sol ; les jeunes jouent un peu.
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 1, when = "lively" },
    # La sieste de midi : couchée, elle rumine.
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute : quelques bouchées, un ou deux pas, et recommencer (fiche § 8.2) ;
# les oreilles restent à l'horizontale.
[[behavior]]
name = "graze"
motion = "graze"
duration = [6.0, 16.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 2 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:160" },
]

# Attentive sans être farouche : le long cou se redresse pour examiner
# ce qui approche ; l’alerte se propage modérément.
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
contagious = 0.2
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Une allure vive, droite et élastique (§ 7), sur ses longues pattes.
# Elle préfère être menée que poussée : la marche se propage volontiers.
# Vitesses du Mannequin mises à l’échelle du stride.
[[behavior]]
name = "walk"
motion = "walk"
speed = 67.3
duration = [3.0, 8.0]
contagious = 0.5
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 117.0
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Un galop bref, peu fréquent : elle regarde ensuite ce qui l’a surprise.
[[behavior]]
name = "run"
motion = "run"
speed = 219.3
duration = [1.0, 2.4]
contagious = 0.3
next = [{ to = "turn", weight = 2 }, { to = "stand", weight = 2 }, { to = "look", weight = 2 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "look", weight = 1 }]

# Couchée sur le sternum, les pattes repliées sous elle ; elle se relève
# l’arrière d’abord, comme les autres moutons.
[[behavior]]
name = "sit"
motion = "sit"
duration = [5.0, 12.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# Elle rumine couchée, la tête haute, la mâchoire qui roule.
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 26.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [75.0, 430.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [120.0, 245.0]
duration = "forever"

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

# --- Les jeux d'agneaux : chez une brebis adulte, rares mais présents.

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [45.0, 390.0]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 310.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

# La course des jeunes : elles filent jusqu’au bord, font demi-tour et
# reviennent ; ce jeu n’est pas propre à la race.
[[behavior]]
name = "race"
motion = "run"
speed = 204.7
duration = [1.2, 2.2]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front, pour jouer.
[[behavior]]
name = "play_back"
motion = "back"
speed = 38.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 160.8
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.5 }

# --- Les gestes sur place.

# S’ébroue : la toison frissonne de la tête à la longue queue.
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêle, bouche ouverte : appel de séparation, commun aux moutons.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 0.4 },
]

# Le flehmen, rare chez une brebis : l'encolure tendue, la tête relevée, la
# lèvre supérieure retroussée, quelques secondes.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 9.0]   # 7 à 19 s chez le bélier (Bahadi 2023), raccourci pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Tape rarement du pied : elle regarde, puis reprend le pâturage ou part.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 3 },
    { to = "stand", weight = 1 },
    { to = "run", weight = 2 },
    { to = "paw", weight = 1, when = "rowdy" },
]

# Une brebis calme ne charge presque jamais : elle gratte le sol, puis le
# plus souvent renonce.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.0, 2.0]
next = [{ to = "back_up", weight = 1 }, { to = "charge", weight = 0.3 }, { to = "stand", weight = 6 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 49.7
duration = [1.0, 1.6]
next = [{ to = "rear", weight = 0.3 }, { to = "charge", weight = 0.5 }, { to = "stand", weight = 5 }]

[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

[[behavior]]
name = "charge"
motion = "charge"
speed = 248.6
duration = [0.7, 1.2]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

# Le vent : elle lui tourne le dos, puis se protège, tête basse, serrée sur
# ses pattes.
[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
