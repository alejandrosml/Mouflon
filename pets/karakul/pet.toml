# Karakul : une brebis noire de quatre ans, grisonnée, début septembre,
# quatre mois après la tonte de printemps (docs/races/karakul.md).
# Le comportement reprend tous les gestes du Mannequin, réglés pour une
# marcheuse du désert : longues traversées, broutage soutenu, vigilance,
# forte cohésion à la marche, fuite courte suivie d'un regard en arrière.
# La défense en cercle et le broutage des branches ne sont pas disponibles
# dans le moteur ; on ne les assimile pas à une charge ou à un flehmen.

[pet]
id = "karakul"
name = "Karakul"
author = "Alejandro San Martin Lamas"
description = "Une brebis Karakul des déserts d’Asie centrale : toison gris brun en longues mèches, tête noire busquée, oreilles pendantes et queue grasse à pointe en S. Grande marcheuse, vigilante et grégaire."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "karakul.svg"
# 0,5 point par cm ; une unité SVG représente un centimètre.
height = 43.115        # bornes du rig : 86,2296 cm, sol et épaisseur des traits compris

[physics]
width = 57.842         # bornes du rig : 115,6835 cm, du nez au bord de la queue
stride = 36.0          # 1,6 × 45 cm de l’épaule au sol, à 0,5 pt/cm

# Les sons du Mannequin (domaine public, voir CREDITS.md) : le bêlement aigu,
# bouche ouverte, de la brebis séparée du troupeau ; pas de sonnaille.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Attentive : un clic la fait d'abord lever la tête, ou bêler.
poke = [
    { to = "look", weight = 4 },
    { to = "bleat", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "run", weight = 1 },
    { to = "stamp", weight = 1, when = "rowdy" },
]
window_side = "turn"
# Deux brebis qui se croisent se reniflent ; les jeux restent occasionnels.
meet = [
    { to = "sniff", weight = 5 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 2, when = "lively" },
]
together = "pronk"
leave = "hop"
# Le pointeur qui file : elle fait face, ou fuit brièvement puis regarde.
startle = [
    { to = "look", weight = 4 },
    { to = "run", weight = 2 },
    { to = "stamp", weight = 1 },
    { to = "hop", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Rustique au vent du désert : elle lui tourne le dos et baisse la tête.
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.0]
next = [
    { to = "walk", weight = 8 },
    # Onze heures de pâturage en Afghanistan (fiche § 8) : elle broute beaucoup.
    { to = "graze", weight = 8 },
    { to = "look", weight = 4 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
    { to = "hop", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 4, when = "cursor_near:220" },
    # Une brebis calme gratte rarement le sol ; les jeunes jouent un peu.
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 1, when = "lively" },
    # La sieste de midi : couchée, elle rumine.
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute en avançant ; les longues oreilles restent pendantes (fiche § 8).
[[behavior]]
name = "graze"
motion = "graze"
duration = [7.0, 18.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 2 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Indépendante et vigilante, elle regarde souvent ; les voisines suivent.
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
contagious = 0.35
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Marcheuse endurante : 18–20 km par jour dans le désert (fiche § 8).
# Les vitesses du Mannequin sont multipliées par stride / 29.
# La durée des traversées et la contagion de marche sont augmentées.
[[behavior]]
name = "walk"
motion = "walk"
speed = 57.1
duration = [6.0, 13.0]
contagious = 0.5
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 99.3
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Une fuite brève, puis elle se retourne pour faire face (fiche § 8).
[[behavior]]
name = "run"
motion = "run"
speed = 186.2
duration = [0.7, 1.4]
contagious = 0.2
next = "turn_watch"

# Après la courte fuite : demi-tour, puis observation. Une transition
# séparée évite de changer les demi-tours ordinaires de la marche.
[[behavior]]
name = "turn_watch"
motion = "turn"
duration = 0.35
next = "look"

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "look", weight = 1 }]

# Couchée sur le sternum, les pattes repliées ; elle se relève par
# l’arrière. Une longue rumination convient aux heures chaudes du désert.
[[behavior]]
name = "sit"
motion = "sit"
duration = [5.0, 12.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# Elle rumine couchée, la tête haute, la mâchoire qui roule.
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [16.0, 34.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [75.0, 430.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [120.0, 245.0]
duration = "forever"

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

# --- Les jeux d'agneaux : chez une brebis adulte, rares mais présents.

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [45.0, 390.0]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 310.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

# La course de jeu reste disponible pour les tempéraments actifs.
[[behavior]]
name = "race"
motion = "run"
speed = 175.0
duration = [1.2, 2.2]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front, pour jouer.
[[behavior]]
name = "play_back"
motion = "back"
speed = 32.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 135.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.5 }

# --- Les gestes sur place.

# S’ébroue : les mèches longues traînent et balancent après le corps.
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "sit", weight = 12, when = "away" },
]

# Plutôt silencieuse : elle bêle surtout séparée du troupeau ou avant le repas.
[[behavior]]
name = "bleat"
motion = "bleat"
contagious = 0.2
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 0.4 },
]

# Le flehmen, rare chez une brebis : l'encolure tendue, la tête relevée, la
# lèvre supérieure retroussée, quelques secondes.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 9.0]   # 7 à 19 s chez le bélier (Bahadi 2023), raccourci pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Tape du pied, tête haute : l'alarme ; le troupeau regarde, puis part.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 3 },
    { to = "stand", weight = 1 },
    { to = "run", weight = 2 },
    { to = "paw", weight = 1, when = "rowdy" },
]

# Une brebis calme ne charge presque jamais : elle gratte le sol, puis le
# plus souvent renonce.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.0, 2.0]
next = [{ to = "back_up", weight = 2 }, { to = "charge", weight = 1 }, { to = "stand", weight = 3 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 40.0
duration = [1.0, 1.6]
next = [{ to = "charge", weight = 1, when = "rowdy" }, { to = "stand", weight = 5 }]

# Geste du Mannequin conservé pour l’aperçu, sans transition spontanée :
# aucune source ne décrit le cabré chez le Karakul.
[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

[[behavior]]
name = "charge"
motion = "charge"
speed = 200.0
duration = [0.7, 1.2]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

# Le vent : elle lui tourne le dos, puis se protège, tête basse, serrée sur
# ses pattes.
[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
