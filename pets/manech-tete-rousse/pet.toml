# Manech tête rousse : un bélier cornu adulte en pleine toison, dessiné
# d’après docs/races/manech-tete-rousse.md. Les comportements du Mannequin
# sont réglés sur la fiche (§ 8) : pâture et rumination, petits pas en
# troupeau, docilité au contact humain, mais disputes entre béliers.
# Les durées et pondérations restent des choix d’animation, pas des mesures
# publiées pour cette race.

[pet]
id = "manech-tete-rousse"
name = "Manech tête rousse"
author = "Alejandro San Martin Lamas"
description = "La Manech tête rousse du Pays basque : un bélier fauve à cornes ambrées, longue toison blanche en mèches pendantes et pattes rousses. Grégaire, docile avec l’homme, plus batailleur entre béliers."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "manech-tete-rousse.svg"
# 0,5 point par cm : 65 cm au garrot, 85,50 cm pour la hauteur utile
# du rig, mesurée dans le moteur (cornes comprises) ; une unité = 1 cm.
height = 42.75          # hauteur affichée, en points

[physics]
width = 52.73          # 0,5 × 105,46 cm du nez au bord de la culotte, laine comprise
stride = 34.4          # 1,6 × 43 cm de pattes × 0,5 point par cm

# Les sons du Mannequin (domaine public, voir CREDITS.md). `mouth = true` :
# il ouvre la bouche en bêlant. Aucun enregistrement propre à la race.
# Pas de sonnaille sur ce bélier (fiche, § 8.4).
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
# Au bord, il préfère suivre la surface ; il descend parfois d’un bond.
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Docile : un clic le fait regarder ou bêler plus que sauter.
poke = [
    { to = "look", weight = 3 },
    { to = "bleat", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "sniff", weight = 1 },
    { to = "stamp", weight = 2, when = "rowdy" },
]
window_side = "turn"
# Deux moutons qui se croisent se reniflent ; le bélier remuant recule
# volontiers avant de cogner du front (fiche, § 8.6).
meet = [
    { to = "sniff", weight = 5 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 3, when = "lively" },
    { to = "play_back", weight = 5, when = "rowdy" },
]
together = "pronk"
leave = "hop"
# Le pointeur qui file : il regarde d’abord, tape parfois du pied ;
# l’alerte peut ensuite entraîner le troupeau (fiche, § 8.7).
startle = [
    { to = "look", weight = 5 },
    { to = "stamp", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "run", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Adapté au climat humide des coteaux basques : il tourne le dos au vent,
# puis se protège, tête basse (fiche, § 8.1).
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [2.0, 5.0]
next = [
    { to = "walk", weight = 6 },
    { to = "graze", weight = 7 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 3 },
    { to = "trot", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 4, when = "cursor_near:220" },
    { to = "paw", weight = 4, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 2, when = "lively" },
    # Habitué au troupeau, il rumine couché entre les périodes de pâture.
    { to = "ruminate", weight = 4, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Pâture des coteaux : quelques bouchées, un pas, puis il recommence
# (fiche, § 8.7). La jupe de mèches descend presque jusqu’à l’herbe.
[[behavior]]
name = "graze"
motion = "graze"
duration = [6.0, 16.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Aux aguets : tête levée, oreilles en avant ; tout le troupeau regarde
# le même point (fiche, § 8.7).
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 4.0]
contagious = 0.4
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Il marche à petits pas en colonne serrée, la toison se balance.
# Vitesses du Mannequin mises à l’échelle des pattes : × 34,4 / 29 ;
# le pas est légèrement ralenti, le troupeau suit (fiche, § 8.3 et 8.7).
[[behavior]]
name = "walk"
motion = "walk"
speed = 54.0
duration = [3.0, 9.0]
contagious = 0.4
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 95.0
duration = [2.0, 4.5]
next = [{ to = "walk", weight = 4 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Au galop ; il détale moins qu'un mouton farouche, mais les autres suivent.
[[behavior]]
name = "run"
motion = "run"
speed = 178.0
duration = [1.0, 2.4]
contagious = 0.4
next = [{ to = "stand", weight = 3 }, { to = "walk", weight = 3 }, { to = "trot", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.4
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Couché sur le sternum, pattes repliées sous lui ; la longue toison
# s’étale autour du corps (fiche, § 8.7).
[[behavior]]
name = "sit"
motion = "sit"
duration = [6.0, 14.0]
next = [
    { to = "stand", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 28.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [25.0, 60.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [75.0, 420.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [120.0, 250.0]
duration = "forever"

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

# --- Les jeux des jeunes restent accessibles aux actifs ; ce bélier
# adulte privilégie la pâture, la marche et les coups de front.

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [50.0, 390.0]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 310.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

[[behavior]]
name = "race"
motion = "run"
speed = 166.0
duration = [1.2, 2.2]
contagious = 0.4
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.4
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front : deux béliers qui se croisent reculent ensemble,
# s'élancent et se cognent (docs/animation-animale.md, § 5).
[[behavior]]
name = "play_back"
motion = "back"
speed = 31.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 130.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 1 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.4
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 2 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

# --- Les gestes sur place.

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêle, bouche ouverte : le répertoire habituel du mouton, sans voix
# spécifique à la Manech tête rousse attestée (fiche, § 8.8).
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.9
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 1 },
    { to = "flehmen", weight = 2, when = "rowdy" },
]

# Le flehmen du bélier : après avoir flairé un autre mouton, l'encolure
# tendue, la tête relevée, la lèvre supérieure retroussée sur le bourrelet
# dentaire, il hume quelques secondes.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 10.0]   # 7 à 19 s chez le bélier (Bahadi 2023), raccourci pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "bleat", weight = 1 }]

# Tape du pied, tête haute : l'alarme.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 3 },
    { to = "stand", weight = 2 },
    { to = "run", weight = 1 },
    { to = "paw", weight = 1, when = "rowdy" },
]

# Gratte le sol, tête basse : le bélier prend son élan avant de charger
# (fiche, § 8.6). La docilité avec l’homme n’efface pas ses disputes.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "back_up", weight = 6 }, { to = "charge", weight = 1 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 40.0
duration = [1.0, 1.6]
next = [
    { to = "rear", weight = 4 },
    { to = "charge", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "charge", weight = 3, when = "rowdy" },
]

# Se cabre, comme tous les béliers (docs/animation-animale.md, § 5), puis
# retombe tête la première et charge.
[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

[[behavior]]
name = "charge"
motion = "charge"
speed = 202.0
duration = [0.8, 1.4]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.4
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [3.0, 6.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
