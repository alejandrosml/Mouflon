# Racka : bélier blanc de cinq ans, fin mars, dix mois après la tonte.
# Dessin à l'échelle d'après docs/races/racka.md : garrot osseux 72 cm,
# toison pleine en cordelettes, tête et pattes rousses, cornes en vis droite.
# Comportements du Mannequin réglés sur la vigilance et les fuites brèves
# de la fiche (§ 8) : arrêts fréquents, alerte contagieuse, demi-tour après
# la fuite. Vitesses mises à l'échelle des pattes ; les jeux restent rares.
# Le combat propre à la race n'étant pas documenté, les rencontres gardent
# une approche lente et une secousse, sans charge frontale ni cabrement.

[pet]
id = "racka"
name = "Racka"
author = "Alejandro San Martin Lamas"
description = "Le bélier hongrois de la Puszta : deux longues cornes droites vrillées, toison crème en cordelettes, tête et pattes rousses, petites oreilles horizontales et longue queue. Vif, farouche et toujours aux aguets."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"

[appearance]
rig = "racka.svg"
# 0,5 point par cm, du sol au bout des cornes (142,4 cm).
height = 71.2

[physics]
# De la fesse au museau (117,4 cm), hors débord de la queue.
width = 58.7
# 1,6 × 46 cm de l'épaule au sol × 0,5 point par cm.
stride = 36.8

# Copies des huit sons du Mannequin, domaine public (voir CREDITS.md).
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.65, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
poke = [{ to = "look", weight = 6 }, { to = "run", weight = 4 }, { to = "stamp", weight = 2 }, { to = "bleat", weight = 1 }]
window_side = "turn"
meet = [{ to = "sniff", weight = 6 }, { to = "look", weight = 3 }, { to = "shake", weight = 2 }, { to = "play_back", weight = 1, when = "lively" }]
together = "pronk"
leave = "hop"
startle = [{ to = "run", weight = 7 }, { to = "look", weight = 4 }, { to = "stamp", weight = 2 }, { to = "hop", weight = 1 }]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "look", weight = 2 }]
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

# Des arrêts courts : surveiller, puis reprendre la pâture.
[[behavior]]
name = "stand"
motion = "stand"
duration = [1.2, 3.0]
next = [
    { to = "walk", weight = 5 },
    { to = "graze", weight = 7 },
    { to = "look", weight = 7 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 2 },
    { to = "shake", weight = 2 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 0.5 },
    { to = "look", weight = 8, when = "cursor_near:240" },
    { to = "stamp", weight = 3, when = "cursor_near:160" },
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Bouchées et petits pas, interrompus souvent par la vigilance.
[[behavior]]
name = "graze"
motion = "graze"
duration = [4.0, 10.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 4 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 7, when = "cursor_near:240" },
]

# Aux aguets ; l’alerte passe rapidement aux voisins.
[[behavior]]
name = "look"
motion = "look"
duration = [1.8, 4.0]
contagious = 0.55
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 3 },
    { to = "run", weight = 5, when = "cursor_near:160" },
    { to = "stamp", weight = 2, when = "cursor_near:240" },
]

# Pas vif et adroit ; les voisins suivent le mouvement.
[[behavior]]
name = "walk"
motion = "walk"
speed = 58.4
duration = [2.5, 7.0]
contagious = 0.4
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 3 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 101.5
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Fuite brève en bande, puis demi-tour pour observer.
[[behavior]]
name = "run"
motion = "run"
speed = 190.3
duration = [0.9, 2.0]
contagious = 0.65
next = [{ to = "turn", weight = 4 }, { to = "look", weight = 5 }, { to = "trot", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "look", weight = 5 }, { to = "walk", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "sit"
motion = "sit"
duration = [4.0, 10.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 3 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# La rumination couchée garde le rythme général des moutons.
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 28.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [70.0, 430.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [110.0, 240.0]
duration = "forever"

# Jeux occasionnels, surtout chez les individus actifs.
[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.3

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [40.0, 380.0]
duration = "forever"
contagious = 0.3
on_land = [
    { to = "land", weight = 3 },
    { to = "gambol", weight = 2 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 300.0]
duration = "forever"
on_land = [{ to = "land", weight = 2 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

[[behavior]]
name = "race"
motion = "run"
speed = 177.7
duration = [1.2, 2.2]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 3 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Rencontre : léger recul puis approche lente, sans élan de combat.
[[behavior]]
name = "play_back"
motion = "back"
speed = 25.0
duration = 1.1
next = "play_lunge"

# Le nom attendu par le moteur est conservé ; la motion est un pas lent.
[[behavior]]
name = "play_lunge"
motion = "walk"
speed = 22.0
duration = [0.6, 1.0]
on_meet = "play_butt"
next = [{ to = "sniff", weight = 3 }, { to = "shake", weight = 2 }, { to = "look", weight = 2 }]

# Au contact, une secousse de tête, sans son de choc.
[[behavior]]
name = "play_butt"
motion = "shake"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.0 }
next = [{ to = "sniff", weight = 3 }, { to = "shake", weight = 2 }, { to = "look", weight = 2 }]

# Invitation du moteur : l’approche suivante reste lente.
[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 3 }, { to = "look", weight = 3 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "sit", weight = 12, when = "away" },
]

[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 1.8]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 1 },
    { to = "flehmen", weight = 2, when = "rowdy" },
]

# Le flehmen du bélier après avoir flairé ; durée générale des ovins.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [7.0, 12.0]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "bleat", weight = 1 }]

[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [{ to = "look", weight = 4 }, { to = "run", weight = 5 }, { to = "shake", weight = 1 }]

# Gratte le sol, puis regarde ou secoue la tête.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "look", weight = 4 }, { to = "shake", weight = 3 }, { to = "back_up", weight = 1 }]

# Quelques pas en arrière pour reprendre ses distances.
[[behavior]]
name = "back_up"
motion = "back"
speed = 36.8
duration = [1.0, 1.6]
next = [{ to = "look", weight = 3 }, { to = "turn", weight = 2 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
