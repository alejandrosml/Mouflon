# Mérinos d'Arles : un floucat blanc de cinq à six ans, mâle castré,
# tondu au printemps, au départ de la transhumance en juin. Les quatre
# flocs, les cornes et le redon suivent docs/races/merinos-d-arles.md.
# Comportements du Mannequin réglés sur le § 8 : apprivoisé, marcheur,
# très grégaire ; il mène le troupeau et ne charge pas.

[pet]
id = "merinos-d-arles"
name = "Mérinos d'Arles"
author = "Alejandro San Martin Lamas"
description = "Un floucat Mérinos d'Arles : velours crème tondu, quatre flocs à rubans rouges, cornes pâles et redon sur un collier de bois. Apprivoisé et grand marcheur, il mène les troupeaux transhumants de Provence."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"

[appearance]
rig = "merinos-d-arles.svg"
# Une unité = un centimètre ; 75 cm au garrot osseux, environ 102,4 cm
# jusqu'au haut des cornes et du toupet : 0,5 point par centimètre.
height = 51.2

[physics]
width = 68.3           # du museau à la fesse : environ 136,5 cm, hors queue
stride = 36.8          # 0,5 × 1,6 × 46 cm (épaule au sol)

# Les huit sons du Mannequin, domaine public (voir CREDITS.md).
# La sonnaille est dessinée : ces sons ne prétendent pas reproduire le
# grave d'un redon de 18 cm, et ne sont pas synchronisés à ses pas.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.6, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 8 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Élevé à la main, il regarde ou renifle avant de s'écarter.
poke = [{ to = "sniff", weight = 5 }, { to = "look", weight = 3 }, { to = "bleat", weight = 1 }]
window_side = "turn"
meet = [{ to = "sniff", weight = 6 }, { to = "look", weight = 2 }, { to = "bleat", weight = 1 }]
together = "pronk"
leave = "hop"
# Le floucat est le dernier à détaler ; une vraie alarme reste possible.
startle = [{ to = "look", weight = 8 }, { to = "stamp", weight = 1 }, { to = "run", weight = 0.5 }]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.0]
next = [
    { to = "walk", weight = 10 },
    { to = "graze", weight = 3 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 2 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 0.5 },
    { to = "sniff", weight = 5, when = "cursor_near:220" },
    { to = "pronk", weight = 0.5, when = "lively" },
    { to = "gambol", weight = 0.5, when = "lively" },
    { to = "pivot", weight = 0.3, when = "lively" },
    { to = "race", weight = 0.5, when = ["lively", "evening"] },
    { to = "trot", weight = 1, when = "lively" },
    { to = "ruminate", weight = 5, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Le redon gêne les arrêts pour brouter : bouchées brèves, puis il repart.
[[behavior]]
name = "graze"
motion = "graze"
duration = [3.0, 7.0]
sound = { name = "broute", chance = 0.3 }
next = [{ to = "walk", weight = 6 }, { to = "stand", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
contagious = 0.4
next = [{ to = "walk", weight = 5 }, { to = "stand", weight = 3 }, { to = "sniff", weight = 2 }]

# Il conduit le troupeau : longues marches, départ souvent imité.
# Vitesses du Mannequin mises à l'échelle du stride ; voir README.md.
[[behavior]]
name = "walk"
motion = "walk"
speed = 58.4
duration = [5.0, 14.0]
contagious = 0.65
next = [
    { to = "walk", weight = 5 },
    { to = "stand", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 101.5
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 5 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "run"
motion = "run"
speed = 190.3
duration = [1.0, 2.0]
contagious = 0.6
next = [{ to = "look", weight = 4 }, { to = "walk", weight = 3 }, { to = "turn", weight = 2 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 5 }, { to = "stand", weight = 2 }]

# Il chôme et rumine couché ; les regroupements sont ceux du moteur.
[[behavior]]
name = "sit"
motion = "sit"
duration = [7.0, 15.0]
next = [
    { to = "ruminate", weight = 6 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 2 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [15.0, 32.0]
next = [{ to = "sit", weight = 3 }, { to = "stretch", weight = 2 }, { to = "stand", weight = 1 }, { to = "sleep", weight = 8, when = "away" }]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = "sit"

[[behavior]]
name = "hop"
motion = "jump"
jump = [70.0, 400.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [110.0, 230.0]
duration = "forever"

# Quelques jeux conservés pour le tempérament actif et les aperçus.
# Cet adulte castré n'a ni charge ni enchaînement de coups de front.
[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [40.0, 370.0]
duration = "forever"
contagious = 0.25
on_land = [{ to = "land", weight = 5 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 300.0]
duration = "forever"
on_land = [{ to = "land", weight = 4 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race"
motion = "run"
speed = 177.7
duration = [1.2, 2.2]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "stand", weight = 3 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 2 }]

# L'aperçu jeux demande ces noms : il recule puis renifle, sans duel.
[[behavior]]
name = "play_back"
motion = "back"
speed = 30.0
duration = 1.1
next = "sniff"

[[behavior]]
name = "back_up"
motion = "back"
speed = 35.0
duration = [1.0, 1.6]
next = "stand"

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.3 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.3 }

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 3 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "walk", weight = 3 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.2
next = [{ to = "stand", weight = 2 }, { to = "sit", weight = 4 }, { to = "sit", weight = 12, when = "away" }]

[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 3 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 4 }, { to = "bleat", weight = 0.5 }, { to = "flehmen", weight = 0.2 }]

# La lèvre reste articulée ; le flehmen est très rare chez cet animal.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 9.0]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 3 }]

[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [{ to = "look", weight = 5 }, { to = "stand", weight = 2 }, { to = "run", weight = 0.5 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
