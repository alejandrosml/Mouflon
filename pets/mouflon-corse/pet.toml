# Mouflon de Corse : un bélier adulte du Cinto en pelage d'hiver, dessiné en
# vecteurs d'après la fiche de la race (OFB, PNA, INPN, ANCGG). Un mouton
# sauvage : bien plus vigilant et prompt à fuir qu'un mouton domestique, vif,
# qui bondit volontiers ; il broute, rumine, joue (les agneaux), se regroupe.
# Les durées et les fréquences de base viennent du Mannequin (voir
# docs/animation-animale.md).

[pet]
# Sexe du dessin adulte actuel ; les variantes anatomiques restent à dessiner.
sex = "male"
id = "mouflon-corse"
name = "Mouflon de Corse"
author = "Alejandro San Martin Lamas"
description = "Le mouflon sauvage des montagnes corses, un bélier du Cinto en pelage d'hiver : poil ras brun-roux, selle blanche sur le flanc, jabot et poitrail noirs, ventre, miroir et balzanes blancs, et de lourdes cornes en spirale autour de l'oreille."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "mouflon-corse.svg"
height = 48.0          # tout le dessin, cornes comprises : 75 cm au garrot à 0,5 pt par cm

[physics]
width = 54.0           # du museau à la croupe, sans les cornes
stride = 45.5          # pas d'un cycle de marche : 1,6 × la longueur des pattes (28,5 pt)

# Les sons du Mannequin et deux appels synthétiques originaux (domaine
# public, voir CREDITS.md). Le bélier sauvage bêle peu.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.6, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }
alarme = { files = ["sons/mouflon-alarme.wav"], volume = 0.5, mouth = false }
grondement = { files = ["sons/mouflon-grondement.wav"], volume = 0.45, mouth = false }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
# Au bord d'un rebord, il saute plus volontiers qu'un mouton domestique.
edge = [{ to = "turn", weight = 4 }, { to = "hop_down", weight = 2 }]
wall = "turn"
# Touché : un animal sauvage détale, ou tape du pied, l'alarme.
poke = [
    { to = "run", weight = 3 },
    { to = "hop", weight = 2 },
    { to = "look", weight = 1 },
    { to = "stamp", weight = 2 },
    { to = "stamp", weight = 3, when = "rowdy" },
]
window_side = "turn"
meet = [
    { to = "sniff", weight = 4 },
    { to = "look", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 4, when = "lively" },
]
together = "pronk"
leave = "hop"
# Le pointeur file tout près : le plus souvent, il s'enfuit.
startle = [
    { to = "run", weight = 5 },
    { to = "look", weight = 2 },
    { to = "stamp", weight = 2 },
    { to = "hop", weight = 1 },
]
sleepy = "yawn"
# Réveillé, il regarde d'abord autour de lui.
wake = [{ to = "look", weight = 2 }, { to = "stretch", weight = 2 }, { to = "sit", weight = 1 }]
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

# Debout, il s'arrête souvent pour regarder : un mouflon voit un homme à un
# kilomètre.
[[behavior]]
name = "stand"
motion = "stand"
duration = [1.2, 3.5]
next = [
    { to = "walk", weight = 5 },
    { to = "graze", weight = 5 },
    { to = "look", weight = 6 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 2 },
    { to = "run", weight = 1 },
    { to = "hop", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 6, when = "cursor_near:260" },
    { to = "stamp", weight = 2, when = "cursor_near:200" },
    { to = "paw", weight = 3, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 2, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 2, when = "lively" },
    { to = "ruminate", weight = 2, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute par courtes reprises, la tête relevée souvent pour surveiller.
[[behavior]]
name = "graze"
motion = "graze"
duration = [3.0, 9.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "look", weight = 5 },
    { to = "walk", weight = 3 },
    { to = "stand", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 5, when = "cursor_near:260" },
    { to = "run", weight = 2, when = "cursor_near:110" },
]

# Aux aguets : la tête haute, il fixe ce qui bouge. L'alerte gagne vite le
# groupe.
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 4.0]
contagious = 0.5
next = [
    { to = "graze", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "stand", weight = 2 },
    { to = "stamp", weight = 1 },
    { to = "run", weight = 1 },
    { to = "sit", weight = 1 },
]

# Il marche, souvent en file : les voisins suivent.
[[behavior]]
name = "walk"
motion = "walk"
speed = 58.0
duration = [3.0, 8.0]
contagious = 0.35
next = [
    { to = "stand", weight = 3 },
    { to = "graze", weight = 3 },
    { to = "look", weight = 4 },
    { to = "turn", weight = 2 },
    { to = "trot", weight = 2 },
    { to = "run", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "hop", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 102.0
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 3 }, { to = "look", weight = 2 }, { to = "stand", weight = 1 }, { to = "run", weight = 1 }]

# La fuite, au galop bondissant ; quand l'un détale, les autres suivent.
# Arrêté, il se retourne pour regarder.
[[behavior]]
name = "run"
motion = "run"
speed = 200.0
duration = [1.2, 3.0]
contagious = 0.6
next = [
    { to = "look", weight = 4 },
    { to = "trot", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "walk", weight = 1 },
    { to = "hop", weight = 1 },
]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Couché, entre deux repas : il rumine plus qu'il ne dort.
[[behavior]]
name = "sit"
motion = "sit"
duration = [4.0, 10.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [10.0, 24.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

# Un sommeil plus court et plus léger que celui d'un mouton domestique.
[[behavior]]
name = "sleep"
motion = "sleep"
duration = [15.0, 40.0]
next = [{ to = "sit", weight = 1 }]

# Il bondit volontiers, d'un rocher à l'autre.
[[behavior]]
name = "hop"
motion = "jump"
jump = [80.0, 460.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [120.0, 260.0]
duration = "forever"

# --- Les jeux des agneaux (voir docs/animation-animale.md).

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.3

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [45.0, 400.0]
duration = "forever"
contagious = 0.3
on_land = [
    { to = "land", weight = 3 },
    { to = "gambol", weight = 2 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 320.0]
duration = "forever"
on_land = [{ to = "land", weight = 2 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

[[behavior]]
name = "race"
motion = "run"
speed = 185.0
duration = [1.2, 2.2]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 3 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front : les deux reculent ensemble, s'élancent et se cognent.
[[behavior]]
name = "play_back"
motion = "back"
speed = 32.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 135.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "gambol", weight = 2 },
    { to = "pivot", weight = 1 },
    { to = "stand", weight = 1 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 3 }, { to = "look", weight = 3 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.3 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.3 }

# --- Les gestes sur place (voir docs/format.md).

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "sit", weight = 12, when = "away" },
]

[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 1.8]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "look", weight = 1 },
    { to = "flehmen", weight = 1.5 },
]

# Le bélier, en rut, flaire une brebis puis fait son flehmen : l'encolure
# tendue, la tête relevée, la lèvre supérieure retroussée, quelques secondes.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [7.0, 12.0]   # 7 à 19 s en moyenne chez de jeunes béliers (Bahadi 2023) : le bas, pour un bureau
# Évocation de parade : ce lien sonore avec le flehmen est un choix de
# présentation, pas une mesure zoologique (voir tools/audio/README.md).
sound = "grondement"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# L'alarme : tête haute, il tape d'un antérieur (et souffle par les naseaux),
# puis fixe ou détale.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
sound = "alarme"
next = [
    { to = "look", weight = 3 },
    { to = "run", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "paw", weight = 2, when = "rowdy" },
]

[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "back_up", weight = 6 }, { to = "charge", weight = 1 }, { to = "stand", weight = 1 }]

# Il recule de quelques mètres sans se retourner, tête basse, puis fonce. Le
# mouflon de Corse ne se cabre pas avant le choc (c'est le mouflon canadien
# qui se dresse).
[[behavior]]
name = "back_up"
motion = "back"
speed = 40.0
duration = [1.0, 1.6]
next = "charge"

# Fonce, tête basse, cornes en avant.
[[behavior]]
name = "charge"
motion = "charge"
speed = 210.0
duration = [0.8, 1.5]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
