# Aquarelle : une brebis peinte à l'aquarelle, faite de morceaux posés sur
# un squelette (voir squelette.toml et docs/squelette.md).

[pet]
id = "aquarelle"
name = "Aquarelle"
author = "Alejandro San Martin Lamas"
description = "Une brebis peinte à l'aquarelle, faite de morceaux posés sur un squelette : le moteur la fait marcher, brouter, se coucher et dormir, sans une seule image d'animation."
version = "0.1.0"
license = "MIT OR Apache-2.0"

[appearance]
skeleton = "squelette.toml"
height = 58.0          # hauteur affichée, en points

[physics]
width = 78.0           # largeur utilisée pour les bords et les murs
stride = 33.0          # pas d'un cycle de marche : 1,6 × la longueur des pattes

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
poke = [{ to = "hop", weight = 2 }, { to = "look", weight = 1 }]
window_side = "turn"
meet = "look"
together = "hop"
leave = "hop"

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.0]
next = [
    { to = "walk", weight = 6 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 2 },
    { to = "run", weight = 1 },
    { to = "hop", weight = 1 },
    { to = "look", weight = 4, when = "cursor_near:220" },
]

# Broute : la tête descend au sol et grignote.
[[behavior]]
name = "graze"
motion = "graze"
duration = [4.0, 12.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 3 },
    { to = "look", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
next = [{ to = "stand", weight = 3 }, { to = "walk", weight = 3 }, { to = "sit", weight = 1 }]

[[behavior]]
name = "walk"
motion = "walk"
speed = 46.0
duration = [3.0, 9.0]
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 3 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "run", weight = 1 },
]

[[behavior]]
name = "run"
motion = "run"
speed = 150.0
duration = [1.2, 2.8]
next = [{ to = "stand", weight = 3 }, { to = "walk", weight = 2 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Couché : l'avant se plie d'abord, les pattes se replient sous la toison.
[[behavior]]
name = "sit"
motion = "sit"
duration = [4.0, 10.0]
next = [
    { to = "stand", weight = 3 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [70.0, 430.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [110.0, 240.0]
duration = "forever"

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
next = [{ to = "look", weight = 3 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
