# Le squelette d'Aquarelle : des morceaux peints (voir `morceaux/`, repeints
# par `cargo run --release -p mouflon-peintre -- pets/aquarelle/morceaux`),
# posés sur des os. Le format est décrit dans docs/squelette.md.
#
# Toutes les positions sont en pixels de la toile où les morceaux ont été
# peints (1200 × 900), l'animal de profil, tourné vers la droite.

size = [1200, 900]
# Le point d'appui : le milieu des sabots, au sol.
ground = [560, 820]
# Ce qui touche l'herbe quand elle broute : le bout du museau, sous la bouche.
muzzle = [944, 538]

# --- Les os, chaque parent avant ses enfants. `at` : l'articulation (le
# point autour duquel l'os tourne) ; `role` : ce que le moteur en fait de
# lui-même (marcher, regarder, cligner, respirer…).

[[bone]]
name = "racine"
at = [560, 820]

[[bone]]
name = "corps"
parent = "racine"
at = [560, 560]
role = "body"

[[bone]]
name = "queue"
parent = "corps"
at = [302, 552]
role = "tail"

# Chaque patte en deux segments : le haut tourne à l'épaule ou à la hanche,
# le bas (le canon et le sabot) au carpe (devant) ou au jarret (derrière).
[[bone]]
name = "patte-arriere-loin"
parent = "corps"
at = [418, 650]
role = "leg-back-far"

[[bone]]
name = "patte-arriere-loin-bas"
parent = "patte-arriere-loin"
at = [411, 738]
role = "leg-back-far-lower"

[[bone]]
name = "patte-avant-loin"
parent = "corps"
at = [706, 655]
role = "leg-front-far"

[[bone]]
name = "patte-avant-loin-bas"
parent = "patte-avant-loin"
at = [716, 744]
role = "leg-front-far-lower"

[[bone]]
name = "patte-arriere-pres"
parent = "corps"
at = [452, 665]
role = "leg-back-near"

[[bone]]
name = "patte-arriere-pres-bas"
parent = "patte-arriere-pres"
at = [456, 738]
role = "leg-back-near-lower"

[[bone]]
name = "patte-avant-pres"
parent = "corps"
at = [742, 668]
role = "leg-front-near"

[[bone]]
name = "patte-avant-pres-bas"
parent = "patte-avant-pres"
at = [750, 744]
role = "leg-front-near-lower"

# Deux mèches de la toison (des festons du ventre) : elles pendent de leur
# attache et suivent le corps avec un ressort amorti.
[[bone]]
name = "meche-1"
parent = "corps"
at = [616, 694]
role = "sway"

[[bone]]
name = "meche-2"
parent = "corps"
at = [536, 696]
role = "sway"

# L'encolure, l'avant de la toison : elle tourne autour de sa base, dans le
# corps ; c'est surtout elle qui descend pour brouter.
[[bone]]
name = "encolure"
parent = "corps"
at = [690, 560]
role = "neck"

# La tête tourne à la nuque, derrière les oreilles.
[[bone]]
name = "tete"
parent = "encolure"
at = [782, 470]
role = "head"

[[bone]]
name = "oreille-loin"
parent = "tete"
at = [794, 440]
role = "ear"

[[bone]]
name = "oreille-pres"
parent = "tete"
at = [806, 454]
role = "ear"

[[bone]]
name = "oeil"
parent = "tete"
at = [878, 480]
role = "eye"

# La pupille du mouton, une fente horizontale : elle suit le regard et reste
# à l'horizontale quand la tête penche.
[[bone]]
name = "pupille"
parent = "oeil"
at = [879, 481]
role = "pupil"

# La mâchoire s'ouvre autour de sa charnière, sous la joue, à hauteur de la
# bouche : pour ruminer, bêler, bâiller.
[[bone]]
name = "machoire"
parent = "tete"
at = [865, 553]
role = "jaw"

# La lèvre supérieure se retrousse autour de son arrière, sous le naseau :
# le flehmen.
[[bone]]
name = "levre"
parent = "tete"
at = [910, 522]
role = "lip"

# --- Les morceaux, de l'arrière vers l'avant. Chacun fait la taille de la
# toile (exportés tels quels) : Mouflon les recadre et les réduit. Le bas de
# chaque patte se pose sous son haut ; l'encolure et les mèches, sous le
# corps (il s'y fond par un bord doux).

[[piece]]
bone = "patte-arriere-loin-bas"
image = "morceaux/patte-arriere-loin-bas.png"

[[piece]]
bone = "patte-arriere-loin"
image = "morceaux/patte-arriere-loin.png"

[[piece]]
bone = "patte-avant-loin-bas"
image = "morceaux/patte-avant-loin-bas.png"

[[piece]]
bone = "patte-avant-loin"
image = "morceaux/patte-avant-loin.png"

[[piece]]
bone = "queue"
image = "morceaux/queue.png"

[[piece]]
bone = "patte-arriere-pres-bas"
image = "morceaux/patte-arriere-pres-bas.png"

[[piece]]
bone = "patte-arriere-pres"
image = "morceaux/patte-arriere-pres.png"

[[piece]]
bone = "patte-avant-pres-bas"
image = "morceaux/patte-avant-pres-bas.png"

[[piece]]
bone = "patte-avant-pres"
image = "morceaux/patte-avant-pres.png"

[[piece]]
bone = "encolure"
image = "morceaux/encolure.png"

[[piece]]
bone = "meche-1"
image = "morceaux/meche-1.png"

[[piece]]
bone = "meche-2"
image = "morceaux/meche-2.png"

[[piece]]
bone = "corps"
image = "morceaux/corps.png"

[[piece]]
bone = "oreille-loin"
image = "morceaux/oreille-loin.png"

# Derrière la tête : le bas du museau (et, cachés tant que la bouche est
# fermée, la joue qui s'étire et l'intérieur de la bouche).
[[piece]]
bone = "machoire"
image = "morceaux/machoire.png"

[[piece]]
bone = "tete"
image = "morceaux/tete.png"

# Sous la lèvre, la gencive, cachée tant qu'elle est baissée ; puis la lèvre.
[[piece]]
bone = "tete"
image = "morceaux/gencive.png"

[[piece]]
bone = "levre"
image = "morceaux/levre.png"

[[piece]]
bone = "oreille-pres"
image = "morceaux/oreille-pres.png"

[[piece]]
bone = "tete"
image = "morceaux/toupet.png"

# L'œil ouvert (l'iris ambré, la pupille, les reflets), et la paupière
# peinte qui le remplace quand il se ferme.
[[piece]]
bone = "oeil"
image = "morceaux/oeil.png"
eyes = "open"

[[piece]]
bone = "pupille"
image = "morceaux/pupille.png"
eyes = "open"

[[piece]]
bone = "oeil"
image = "morceaux/reflet.png"
eyes = "open"

[[piece]]
bone = "oeil"
image = "morceaux/oeil-ferme.png"
eyes = "closed"

# --- Une animation à clés, en plus de ce que fait le moteur : au calme, de
# temps en temps, une oreille frémit et la queue frétille. Les instants vont
# de 0 à 1 (une boucle de `length` secondes), les angles en degrés (sens des
# aiguilles d'une montre).

[[clip]]
name = "calme"
length = 7.0

[clip.bones.oreille-pres]
rotate = [[0, 0], [0.42, 0], [0.45, 14], [0.48, -4], [0.52, 7], [0.57, 0]]

[clip.bones.queue]
rotate = [[0, 0], [0.78, 0], [0.8, 18], [0.82, -14], [0.84, 16], [0.86, -10], [0.9, 0]]

[motions]
idle = "calme"
