# Skudde : bélier blanc adulte, 58 cm au garrot, en automne.
# Comportements du Mannequin adaptés à la fiche docs/races/skudde.md § 8 :
# vif et farouche, grégaire, bon sauteur ; alarme puis fuite courte et regard.
# Les réglages sont une interprétation, pas des mesures comportementales.

[pet]
id = "skudde"
name = "Skudde"
author = "Alejandro San Martin Lamas"
description = "Petit bélier de Prusse orientale, blanc crème : longues mèches pointues, crinière au cou et à l’épaule, cornes ambrées en colimaçon, face mouchetée, queue courte. Vif, farouche et grégaire."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "skudde.svg"
# 0,5 pt/cm ; du sol au sommet des cornes : environ 77 cm.
height = 38.5

[physics]
width = 54.0           # environ 108 cm de la queue au nez, à 0,5 pt/cm
stride = 32.8          # 1,6 × 41 cm épaule-sol × 0,5 pt/cm

# Les sons (domaine public, voir CREDITS.md). `mouth = true` : c'est sa voix,
# il ouvre la bouche en la faisant entendre.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

# Les réflexes : ce qu'il fait quand quelque chose lui arrive. `when` choisit
# selon les circonstances ou le tempérament (calm, lively, rowdy, even).
[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 3 }, { to = "hop_down", weight = 2 }]
wall = "turn"
poke = [
    { to = "hop", weight = 2 },
    { to = "look", weight = 1 },
    { to = "stamp", weight = 2 },
    { to = "stamp", weight = 3, when = "rowdy" },
]
window_side = "turn"
# Deux moutons qui se croisent se reniflent le museau ; deux actifs jouent
# parfois à se cogner le front (voir `play_back`).
meet = [
    { to = "sniff", weight = 4 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_invite", weight = 1, when = "lively" },
]
together = "pronk"     # tous ensemble : des sauts d'agneau
leave = "hop"
# Le pointeur file tout près : il lève la tête, tape du pied, ou détale.
startle = [
    { to = "look", weight = 3 },
    { to = "stamp", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "run", weight = 4 },
]
# L'utilisateur est parti : il bâille, se couche, s'endort.
sleepy = "yawn"
# Il revient : il se lève et s'étire, comme un mouton qui se relève.
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Un coup de vent : il tourne le dos au vent (s'il l'a dans le museau), puis
# se protège, tête basse.
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.0]
next = [
    { to = "walk", weight = 6 },
    { to = "graze", weight = 8 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
    { to = "hop", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 0.3 },
    { to = "look", weight = 6, when = "cursor_near:300" },
    { to = "stamp", weight = 3, when = "cursor_near:180" },
    # Selon son tempérament : un énervé gratte le sol avant de foncer, un
    # actif joue comme un agneau (sauts raides ou tordus, demi-tours en
    # l'air, courses), un calme se couche pour ruminer.
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "pronk", weight = 2, when = "lively" },
    { to = "gambol", weight = 2, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },   # les agneaux courent surtout le soir
    { to = "trot", weight = 2, when = "lively" },
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute : la tête descend au sol, une bouchée par seconde ; de temps en
# temps, un pas en avant vers l'herbe suivante, sans lever la tête.
[[behavior]]
name = "graze"
motion = "graze"
duration = [4.0, 12.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 3 },
    { to = "look", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:300" },
]

# Aux aguets : la tête levée, il regarde. L'alerte se propage : un voisin
# qui le voit lever la tête la lève souvent aussi (`contagious`).
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
contagious = 0.5
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Il marche ; ses voisins le suivent souvent, du même côté (les moutons
# partent rarement seuls).
[[behavior]]
name = "walk"
motion = "walk"
speed = 52.0
duration = [3.0, 9.0]
contagious = 0.5
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 3 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
]

# Au trot, les pattes vont par paires diagonales (le moteur choisit
# l'allure d'après la vitesse rapportée à la longueur des pattes).
[[behavior]]
name = "trot"
motion = "walk"
speed = 91.0
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Au galop : le galop transverse des moutons. Quand l'un détale, les autres
# détalent aussi.
[[behavior]]
name = "run"
motion = "run"
speed = 170.0
duration = [1.0, 2.1]
contagious = 0.5
next = [{ to = "look", weight = 6 }, { to = "turn", weight = 2 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Couché : l'avant se plie d'abord, les pattes se replient sous la toison ;
# il se relève l'arrière d'abord, et s'étire souvent en se relevant.
[[behavior]]
name = "sit"
motion = "sit"
duration = [4.0, 10.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 3 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# Il rumine, couché : il mâche un bol, l'avale, une pause, le suivant.
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [10.0, 24.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

# Il dort, couché ; une fois sur deux, la tête posée au sol, le cou tendu.
# De temps en temps, une oreille ou une patte tressaille.
[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [70.0, 430.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [110.0, 240.0]
duration = "forever"

# Saut d'agneau : droit en l'air, les quatre pattes raides, la tête qui
# secoue. Les autres s'y mettent souvent.
[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.3

# --- Les jeux d'agneaux, surtout chez les actifs (voir
# docs/animation-animale.md) : il se ramasse, puis bondit.

# Saut tordu : en l'air, le corps se tord, la tête part de l'autre côté, les
# pattes de derrière ruent (`twist`). Il en enchaîne souvent plusieurs.
[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [40.0, 380.0]
duration = "forever"
contagious = 0.3
on_land = [
    { to = "land", weight = 3 },
    { to = "gambol", weight = 2 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

# Un petit bond sur place, en se retournant en l'air (`spin`).
[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 300.0]
duration = "forever"
on_land = [{ to = "land", weight = 2 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

# La course des agneaux : ils filent en bande jusqu'au bout, font demi-tour
# et reviennent.
[[behavior]]
name = "race"
motion = "run"
speed = 140.0
duration = [1.2, 2.2]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 3 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front : deux agneaux qui se croisent reculent ensemble (une durée
# fixe, pour repartir en même temps), s'élancent et se cognent le front ;
# l'élan prévoit la rencontre (`on_meet`), le choc les tasse tous les deux.
[[behavior]]
name = "play_back"
motion = "back"
speed = 26.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 110.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "gambol", weight = 2 },
    { to = "pivot", weight = 1 },
    { to = "stand", weight = 1 },
]

# L'invitation au jeu : il fixe un autre agneau, la tête et l'avant baissés,
# en sautillant. Le moteur la propose de lui-même, surtout aux actifs, quand
# un voisin de la famille est à deux ou trois longueurs ; l'autre accepte
# souvent, et ils s'élancent l'un vers l'autre (`play_lunge`).
[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

# Atterri rudement : un peu sonné, puis il s'ébroue.
[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

# --- Les gestes sur place. Le moteur les anime de lui-même (voir
# docs/format.md) ; `duration` dit combien de temps ils durent.

# S'ébroue : la secousse part de la tête et file jusqu'à la queue, six fois
# par seconde.
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

# S'étire en se levant : le cou tendu, puis une patte arrière loin derrière.
[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

# Se gratte d'un sabot arrière.
[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

# Bâille : la tête se lève, la bouche s'ouvre grand, les yeux se ferment.
# Contagieux, comme chez nous. L'utilisateur parti, il va se coucher.
[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêle, la bouche ouverte.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Renifle, le museau tendu (deux moutons qui se rencontrent).
[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 1.8]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 1 },
    { to = "flehmen", weight = 2, when = "rowdy" },
]

# Le flehmen : après avoir flairé un autre mouton, l'encolure tendue, la
# tête relevée, la lèvre supérieure retroussée, il hume quelques secondes
# (le bélier en rut, surtout ; un énervé plus souvent).
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [7.0, 12.0]   # 7 à 19 s en moyenne chez de jeunes béliers (Bahadi 2023) : le bas, pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "bleat", weight = 1 }]

# Tape du pied, tête haute : l'alarme des moutons.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [{ to = "run", weight = 5 }, { to = "look", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "run", weight = 4 }, { to = "stand", weight = 4 }, { to = "back_up", weight = 1 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 34.0
duration = [1.0, 1.6]
next = [{ to = "run", weight = 5 }, { to = "stand", weight = 3 }, { to = "charge", weight = 1, when = "rowdy" }]

[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

# Fonce, tête basse, oreilles couchées.
[[behavior]]
name = "charge"
motion = "charge"
speed = 170.0
duration = [0.8, 1.5]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

# Sonné : la tête tourne, les yeux mi-clos.
[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

# Le vent : il lui tourne le dos, puis se protège, tête basse, oreilles
# couchées, serré sur ses pattes.
[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
