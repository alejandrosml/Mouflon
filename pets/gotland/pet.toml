# Gotland : une brebis adulte de trois à cinq ans, gris moyen bleuté, en
# pleine toison d'automne, d'après docs/races/gotland.md. Les comportements
# reprennent ceux du Mannequin, réglés sur la fiche (§ 8) : vive, curieuse,
# familière, rustique et grégaire, elle regarde et renifle volontiers, fuit
# peu et brièvement, broute longtemps et rumine couchée. Les durées et les
# poids restent des choix d'animation, pas des mesures propres à la race.

[pet]
id = "gotland"
name = "Gotland"
author = "Alejandro San Martin Lamas"
description = "Une brebis de Gotland en toison d'automne : boucles gris argenté lustrées, tête noire fine sans cornes, œil ambre, pattes noires et queue naturellement courte. Vive, curieuse et familière."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"

[appearance]
rig = "gotland.svg"
# Une unité SVG = un cm ; 70 cm au garrot sous la toison. Les limites du
# dessin, lues par le moteur, font 94,5 cm : 0,5 point par centimètre.
height = 47.25

[physics]
width = 61.47          # limites du dessin : 122,94 cm, du museau à la queue
stride = 37.6          # 0,5 × 1,6 × 47 cm de l'épaule au sol

# Les sons du Mannequin, domaine public (CC0, voir CREDITS.md), copiés
# à l'identique. Aucune voix particulière au Gotland n'est documentée ;
# aucune sonnaille dans les références de cette brebis.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
# Mobile sur les pâtures difficiles, elle descend parfois d'un rebord.
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1.5 }]
wall = "turn"
poke = [
    { to = "look", weight = 5 },
    { to = "sniff", weight = 3 },
    { to = "bleat", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "stamp", weight = 1, when = "rowdy" },
]
window_side = "turn"
# Curieuse et familière : les rencontres sont surtout des reniflements.
meet = [
    { to = "sniff", weight = 6 },
    { to = "look", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 1, when = "lively" },
]
together = "pronk"
leave = "hop"
# Vive sans être farouche : une alerte fait surtout lever la tête.
startle = [
    { to = "look", weight = 7 },
    { to = "stamp", weight = 1 },
    { to = "hop", weight = 0.5 },
    { to = "run", weight = 0.5 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Le type ancien reste dehors et se protège derrière les rochers : elle
# tourne le dos au vent puis se campe, sans s'assoupir pour s'en protéger.
wind = [{ to = "turn_away", weight = 5, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.5]
next = [
    { to = "walk", weight = 6 },
    { to = "graze", weight = 7 },
    { to = "look", weight = 5 },
    { to = "sniff", weight = 2 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    # Le moteur suit le pointeur du regard ; le format ne dirige pas une
    # marche vers lui. On traduit sa curiosité par le regard et le flair.
    { to = "look", weight = 6, when = "cursor_near:220" },
    { to = "sniff", weight = 3, when = "cursor_near:220" },
    { to = "rear", weight = 0.2, when = "on_floor" },
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 2, when = "lively" },
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Au pâturage, les Gotland se dispersent. Le broutage ne se propage donc
# pas ; le format ne règle pas l'écart entre voisines selon leur activité.
[[behavior]]
name = "graze"
motion = "graze"
duration = [6.0, 16.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 2 },
    { to = "scratch", weight = 1 },
    { to = "rear", weight = 0.15, when = "on_floor" },
    { to = "look", weight = 4, when = "cursor_near:220" },
    { to = "sniff", weight = 2, when = "cursor_near:220" },
]

# Le regard haut est souvent de la curiosité : peu contagieux.
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 4.0]
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 4 },
    { to = "sniff", weight = 2 },
    { to = "sniff", weight = 3, when = "cursor_near:220" },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Malgré le pâturage dispersé, le troupeau garde un fort instinct grégaire :
# quand l'une part, les autres la suivent volontiers. Vitesses mises à
# l'échelle des pattes : le Mannequin × 37,6 / 29.
[[behavior]]
name = "walk"
motion = "walk"
speed = 58.0
duration = [3.0, 9.0]
contagious = 0.4
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 5 },
    { to = "look", weight = 3 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 104.0
duration = [2.0, 4.5]
next = [{ to = "walk", weight = 4 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Fuite rare et courte, suivie d'un regard ou d'un retour au pâturage.
[[behavior]]
name = "run"
motion = "run"
speed = 185.0
duration = [0.8, 1.8]
contagious = 0.4
next = [{ to = "look", weight = 3 }, { to = "stand", weight = 3 }, { to = "graze", weight = 2 }, { to = "walk", weight = 2 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "look", weight = 1 }]

# Couchée sur le sternum, les pattes repliées sous la toison d'automne.
[[behavior]]
name = "sit"
motion = "sit"
duration = [6.0, 13.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 26.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [75.0, 430.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [120.0, 245.0]
duration = "forever"

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

# Les jeux d'agneaux restent présents, mais peu fréquents chez l'adulte.
[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [45.0, 390.0]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 310.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

[[behavior]]
name = "race"
motion = "run"
speed = 175.0
duration = [1.2, 2.2]
contagious = 0.4
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Les coups de front restent des jeux, réservés surtout au tempérament actif.
[[behavior]]
name = "play_back"
motion = "back"
speed = 32.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 135.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [{ to = "shake", weight = 2 }, { to = "sniff", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

# La secousse fait frissonner les boucles jusque sous le ventre.
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [{ to = "stand", weight = 3 }, { to = "look", weight = 1 }, { to = "sit", weight = 2 }, { to = "sit", weight = 12, when = "away" }]

# Le bêlement de la brebis séparée de son troupeau.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.2]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 3 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 0.25 },
]

# Rare chez la brebis : la lèvre se retrousse, sans cornes ni crinière.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 9.0]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 5 },
    { to = "stand", weight = 3 },
    { to = "run", weight = 1 },
    { to = "paw", weight = 0.5, when = "rowdy" },
]

# Les gestes agressifs du modèle restent disponibles pour le tempérament
# énervé ; une brebis familière renonce généralement après avoir gratté.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.0, 2.0]
next = [{ to = "stand", weight = 5 }, { to = "back_up", weight = 2 }, { to = "charge", weight = 0.3, when = "rowdy" }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 38.0
duration = [1.0, 1.6]
next = [{ to = "stand", weight = 4 }, { to = "sniff", weight = 2 }, { to = "charge", weight = 0.2, when = "rowdy" }]

# Ekman décrit le Gotland debout sur les postérieurs pour atteindre le
# genévrier (§ 8.1). Le moteur n'anime pas de buisson : ce bref cabré mâché
# en est une évocation, puis la brebis reprend le pâturage, sans charger.
[[behavior]]
name = "rear"
motion = "rear"
chew = true
duration = 1.15
next = [{ to = "graze", weight = 5 }, { to = "stand", weight = 3 }, { to = "look", weight = 1 }]

[[behavior]]
name = "charge"
motion = "charge"
speed = 180.0
duration = [0.6, 0.9]
next = [{ to = "stand", weight = 3 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [1.8, 3.5]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]
