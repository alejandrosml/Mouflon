# Landes de Bretagne : une brebis adulte blanche de trois à cinq ans, sans
# cornes, en pleine toison de mai, d'après docs/races/landes-de-bretagne.md.
# Tous les gestes du Mannequin sont conservés, réglés sur la fiche (§ 8) :
# vive, curieuse, peu craintive ; elle broute longtemps, repart marcher,
# renifle ses voisines et rumine couchée. Le grégarisme reste ordinaire ;
# charges et flehmen sont rares chez cette brebis adulte. Les jeux restent
# accessibles aux tempéraments actifs, sans en faire un agneau.
# Le moteur ne propose pas encore de broutage des buissons en hauteur ni
# d'interaction mère-agneau : ces comportements de la fiche restent à faire.
# Les poids et durées sont une interprétation, pas des mesures de la race.

[pet]
id = "landes-de-bretagne"
name = "Landes de Bretagne"
author = "Alejandro San Martin Lamas"
description = "La brebis des Landes de Bretagne : petite et rustique, toison crème en longues mèches, tête nue mouchetée de roux, petites oreilles roses et longue queue laineuse en crosse. Vive et curieuse."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "landes-de-bretagne.svg"
# 0,5 point par cm : 57 cm au garrot osseux ; bornes peintes du moteur
# hautes de 78,76881886 cm (du sol au haut : 78,8 cm). Une unité = un cm.
height = 39.3844

[physics]
width = 46.5           # environ 93 cm du nez à la fesse, hors queue
stride = 30.4          # 0,5 × 1,6 × 38 cm de l'épaule au sol

# Les sons du Mannequin, copiés sans modification (domaine public, voir
# CREDITS.md). Aucune voix propre à la race n'est décrite (fiche, § 8.5).
# Pas de sonnaille : aucune n'est attestée pour l'individu de la fiche.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Curieuse et peu craintive (§ 8.1) : un clic la fait regarder ou renifler.
poke = [
    { to = "look", weight = 4 },
    { to = "bleat", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "sniff", weight = 2 },
    { to = "stamp", weight = 1, when = "rowdy" },
]
window_side = "turn"
# Deux brebis qui se croisent se reniflent ; les jeunes jouent parfois.
meet = [
    { to = "sniff", weight = 5 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 2, when = "lively" },
]
together = "pronk"
leave = "hop"
# Une surprise : elle regarde avant de fuir ; si elle part, le troupeau suit.
startle = [
    { to = "look", weight = 5 },
    { to = "run", weight = 1 },
    { to = "stamp", weight = 1 },
    { to = "hop", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Rustique, dehors toute l'année (§ 8.1) : elle tourne le dos au vent.
# Elle se tasse brièvement, puis retourne volontiers brouter.
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.0]
next = [
    { to = "walk", weight = 6 },
    # Les landes, prairies humides et épineux : elle broute beaucoup (§ 8.3).
    { to = "graze", weight = 8 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
    { to = "hop", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 4, when = "cursor_near:220" },
    # Une brebis calme gratte rarement le sol ; les jeunes jouent un peu.
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 1, when = "lively" },
    # La sieste de midi : couchée, elle rumine.
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute en avançant dans les prairies (§ 8.3) : quelques bouchées, un pas,
# et recommencer. Les oreilles restent à l'horizontale.
[[behavior]]
name = "graze"
motion = "graze"
duration = [6.0, 16.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 2 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Le troupeau se suit et s'alerte comme un troupeau ordinaire (§ 8.2),
# sans lui prêter une vigilance particulièrement farouche.
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
contagious = 0.25
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Vive (§ 8.1), elle repart marcher et brouter ; les voisines suivent.
# Vitesses du Mannequin mises à l'échelle des pattes : × 30,4 / 29.
# Les impulsions verticales sont ajustées selon la racine de cette échelle.
[[behavior]]
name = "walk"
motion = "walk"
speed = 48.2
duration = [3.0, 8.0]
contagious = 0.25
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 83.9
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Au galop : une fuite courte en bloc, puis tout le monde se retourne.
[[behavior]]
name = "run"
motion = "run"
speed = 157.2
duration = [1.0, 2.4]
contagious = 0.45
next = [{ to = "turn", weight = 2 }, { to = "stand", weight = 2 }, { to = "look", weight = 2 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "look", weight = 1 }]

# Couchée sur le sternum, les pattes repliées sous elle ; elle se relève
# l'arrière d'abord. Au chaud de midi, couchée en tas à l'ombre.
[[behavior]]
name = "sit"
motion = "sit"
duration = [5.0, 12.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# Elle rumine couchée, la tête haute, la mâchoire qui roule.
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 26.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [73.4, 440.3]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [115.3, 245.7]
duration = "forever"

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

# --- Les jeux d'agneaux : chez une brebis adulte, rares mais présents.

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [41.9, 389.1]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 307.2]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

# La course : elles filent en bande jusqu'au bout, font demi-tour et
# reviennent (le troupeau qui part en bloc).
[[behavior]]
name = "race"
motion = "run"
speed = 146.8
duration = [1.2, 2.2]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front, pour jouer.
[[behavior]]
name = "play_back"
motion = "back"
speed = 27.3
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 115.3
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.5 }

# --- Les gestes sur place.

# S'ébroue : les mèches et la longue queue suivent la secousse.
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêle, bouche ouverte : un appel au troupeau ou à son agneau (§ 8.5).
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 0.2 },
]

# Le flehmen, rare chez une brebis : l'encolure tendue, la tête relevée, la
# lèvre supérieure retroussée, quelques secondes.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 9.0]   # 7 à 19 s chez le bélier (Bahadi 2023), raccourci pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Tape du pied, tête haute : l'alarme ; le troupeau regarde, puis part.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 3 },
    { to = "stand", weight = 1 },
    { to = "run", weight = 2 },
    { to = "paw", weight = 1, when = "rowdy" },
]

# Une brebis calme ne charge presque jamais : elle gratte le sol, puis le
# plus souvent renonce.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.0, 2.0]
next = [{ to = "back_up", weight = 1 }, { to = "charge", weight = 0.3 }, { to = "stand", weight = 4 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 35.6
duration = [1.0, 1.6]
next = [{ to = "rear", weight = 0.2 }, { to = "charge", weight = 0.5 }, { to = "stand", weight = 4 }]

[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

[[behavior]]
name = "charge"
motion = "charge"
speed = 178.2
duration = [0.7, 1.2]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

# Le vent : elle lui tourne le dos, puis se protège, tête basse, serrée sur
# ses pattes.
[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [1.8, 3.5]
next = [{ to = "shake", weight = 1 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 3 }]
