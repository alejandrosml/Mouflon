# Ouessant : le bélier noir de la race d'Ouessant, l'un des plus petits
# moutons du monde (île d'Ouessant, Finistère). Vif, rustique et très grégaire : il
# broute en marchant, rumine couché, détale en bande à la moindre alerte puis
# fait volte-face pour regarder. Les durées et les fréquences viennent du
# standard de la race et de ce que les études disent des moutons (voir
# docs/animation-animale.md).

[pet]
id = "ouessant"
name = "Ouessant"
author = "Alejandro San Martin Lamas"
description = "Le mouton d'Ouessant, l'un des plus petits moutons du monde : un bélier noir à la toison bouclée roussie par le soleil, tête et pattes noir de jais, cravate sous la gorge et fortes cornes en une large spirale autour de l'oreille."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "ouessant.svg"
height = 32.1          # 47 cm au garrot à 0,5 pt par cm ; cornes comprises

[physics]
width = 39.1           # du nez à la croupe
stride = 24.8          # pas d'un cycle de marche : 1,6 × la longueur des pattes

# Les sons (domaine public, voir CREDITS.md). `mouth = true` : c'est sa voix,
# il ouvre la bouche en la faisant entendre.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
# Agile : il saute volontiers d'un talus.
edge = [{ to = "turn", weight = 4 }, { to = "hop_down", weight = 2 }]
wall = "turn"
# Un clic : hardi pour sa taille, il tape du pied plus qu'il ne fuit.
poke = [
    { to = "hop", weight = 2 },
    { to = "look", weight = 2 },
    { to = "bleat", weight = 2 },
    { to = "stamp", weight = 2 },
    { to = "stamp", weight = 3, when = "rowdy" },
]
window_side = "turn"
# Deux béliers qui se croisent se reniflent ; celui-ci est souvent le premier
# à chercher la bagarre (coups de front, voir `play_back`).
meet = [
    { to = "sniff", weight = 4 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 2 },
    { to = "play_back", weight = 4, when = "lively" },
]
together = "pronk"
leave = "hop"
# Le pointeur file tout près : alerte, et le troupeau détale en bande.
startle = [
    { to = "look", weight = 3 },
    { to = "stamp", weight = 2 },
    { to = "run", weight = 3 },
    { to = "hop", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Mouton d'une île battue par le vent : il lui tourne le dos et se serre.
wind = [{ to = "turn_away", weight = 5, when = "into_wind" }, { to = "brace", weight = 2 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.2, 3.2]
next = [
    { to = "walk", weight = 6 },
    { to = "graze", weight = 7 },
    { to = "look", weight = 4 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 2 },
    { to = "run", weight = 1 },
    { to = "hop", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 2 },
    { to = "look", weight = 4, when = "cursor_near:220" },
    # Un énervé gratte le sol avant de foncer ; un actif joue encore comme un
    # agneau ; un calme se couche pour ruminer.
    { to = "paw", weight = 4, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 2, when = "lively" },
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Il broute en marchant : la tête au sol, une bouchée par seconde, un pas
# vers l'herbe suivante ; les oreilles restent aux aguets. Le troupeau broute
# ensemble.
[[behavior]]
name = "graze"
motion = "graze"
duration = [5.0, 14.0]
contagious = 0.15
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 3 },
    { to = "look", weight = 2 },
    { to = "scratch", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Aux aguets : la tête haute, il regarde ; l'alerte gagne le troupeau.
[[behavior]]
name = "look"
motion = "look"
duration = [1.2, 3.0]
contagious = 0.3
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "stamp", weight = 1 },
]

# Des pas courts et vifs ; ses voisins le suivent souvent.
[[behavior]]
name = "walk"
motion = "walk"
speed = 40.0
duration = [2.5, 7.0]
contagious = 0.3
next = [
    { to = "stand", weight = 3 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 2 },
    { to = "run", weight = 1 },
]

# Un trot vif et rebondi, les pattes par paires diagonales.
[[behavior]]
name = "trot"
motion = "walk"
speed = 66.0
duration = [1.5, 4.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }, { to = "look", weight = 1 }]

# Au galop, par courtes pointes ; quand l'un détale, le troupeau détale avec
# lui. Il s'arrête vite et fait volte-face pour regarder.
[[behavior]]
name = "run"
motion = "run"
speed = 128.0
duration = [0.8, 1.8]
contagious = 0.55
next = [{ to = "volte", weight = 4 }, { to = "stand", weight = 1 }, { to = "trot", weight = 1 }]

[[behavior]]
name = "volte"
motion = "turn"
duration = 0.35
next = "look"

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Couché : l'avant se plie d'abord ; il se relève l'arrière d'abord. Il se
# couche volontiers pour ruminer.
[[behavior]]
name = "sit"
motion = "sit"
duration = [5.0, 12.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# Il rumine, couché : il mâche un bol, l'avale, une pause, le suivant.
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 30.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

# Il dort, couché ; une fois sur deux, la tête posée au sol, le cou tendu.
[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

# De petits sauts secs, comme sur les rochers de son île.
[[behavior]]
name = "hop"
motion = "jump"
jump = [55.0, 330.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [85.0, 185.0]
duration = "forever"

# Saut d'agneau : droit en l'air, les quatre pattes raides, la tête qui
# secoue. Les autres s'y mettent souvent.
[[behavior]]
name = "pronk"
motion = "pronk"
jump = [20.0, 330.0]
duration = "forever"
contagious = 0.3

# --- Les jeux (voir docs/animation-animale.md) : il se ramasse, puis bondit.

# Saut tordu : en l'air, le corps se tord, la tête part de l'autre côté, les
# pattes de derrière ruent.
[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [30.0, 290.0]
duration = "forever"
contagious = 0.3
on_land = [
    { to = "land", weight = 3 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

# Un petit bond sur place, en se retournant en l'air.
[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 230.0]
duration = "forever"
on_land = [{ to = "land", weight = 2 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

# La course : ils filent en bande jusqu'au bout, font demi-tour et reviennent.
[[behavior]]
name = "race"
motion = "run"
speed = 120.0
duration = [1.0, 2.0]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 3 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front entre béliers : ils reculent ensemble, s'élancent et se
# cognent le front, les cornes contre les cornes.
[[behavior]]
name = "play_back"
motion = "back"
speed = 22.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 94.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "play_back", weight = 1 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

# L'invitation au jeu : il fixe l'autre, la tête et l'avant baissés, en
# sautillant ; le moteur la propose de lui-même aux actifs.
[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.3
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

# Atterri rudement : un peu sonné, puis il s'ébroue.
[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.8
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

# Tenu : seul, loin du troupeau, il appelle.
[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.5 }

# --- Les gestes sur place (voir docs/format.md).

# S'ébroue : la secousse part de la tête et file jusqu'à la queue.
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

# S'étire en se levant : le cou tendu, puis une patte arrière loin derrière.
[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

# Se gratte d'un sabot arrière.
[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.2, 2.2]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

# Bâille ; contagieux. L'utilisateur parti, il va se coucher.
[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêle, la bouche ouverte ; il entraîne souvent les autres à bêler.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
contagious = 0.2
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Renifle, le museau tendu (deux moutons qui se rencontrent).
[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 1.8]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Tape du pied, tête haute : l'alarme des moutons.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "run", weight = 1 },
    { to = "paw", weight = 2, when = "rowdy" },
]

# Gratte le sol d'un sabot de devant, tête basse : il va charger.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.0, 2.0]
next = [{ to = "back_up", weight = 6 }, { to = "charge", weight = 1 }, { to = "stand", weight = 1 }]

# Recule sans se retourner, tête basse, pour prendre son élan.
[[behavior]]
name = "back_up"
motion = "back"
speed = 29.0
duration = [1.0, 1.6]
next = [{ to = "rear", weight = 3 }, { to = "charge", weight = 2 }]

# Se cabre, puis retombe d'un coup, tête la première ; et il charge.
[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

# Fonce, tête basse, oreilles couchées, les cornes en avant.
[[behavior]]
name = "charge"
motion = "charge"
speed = 145.0
duration = [0.7, 1.3]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

# Sonné : la tête tourne, les yeux mi-clos.
[[behavior]]
name = "daze"
motion = "daze"
duration = [1.4, 2.4]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

# Le vent : il lui tourne le dos, puis se serre, tête basse, oreilles
# couchées ; rustique, il ne s'y attarde pas.
[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.0, 4.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "graze", weight = 1 }]
