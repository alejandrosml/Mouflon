# Southdown : une agnelle anglaise de huit semaines, encore allaitée, au
# pré début mai. Le dessin suit docs/races/southdown.md ; le comportement
# part du Mannequin, réglé sur la fiche (§ 8) : docile et curieuse, mais à
# l'âge du second pic de jeu. Les gambades et les pivots dominent ; les
# petits coups de front restent possibles, moins souvent que chez un mâle.
# Le moteur ne connaît pas encore le lien mère-agneau ni la tétée : ce
# fichier emploie seulement les mouvements déjà animés (animation-animale § 11).

[pet]
id = "southdown"
name = "Southdown"
author = "Alejandro San Martin Lamas"
description = "Une agnelle Southdown de huit semaines : laine crème frisée, museau souris, truffe gris-rosé, oreilles horizontales, longues pattes aux chaussettes faon et queue entière. Curieuse, docile et joueuse."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"

[appearance]
rig = "southdown.svg"
# Une unité = un centimètre ; 0,5 point par cm. Environ 45 cm au garrot
# osseux ; étendue verticale du dessin : 57,048 cm (sol → sommet : 57,01 cm).
height = 28.524

[physics]
width = 30.23          # 60,46 cm d’étendue horizontale du dessin
stride = 25.6          # 1,6 × 32 cm de l'épaule au sol × 0,5 pt/cm

# Le vrai bêlement d'agneau déjà livré avec Lainou (OpenGameArt, CC0),
# bouche ouverte ; pas les quatre prises de chevreaux. Le broutage et les
# petits bruits d'appui sont aussi repris à l'identique (voir sons/README.md).
# Pas de cloche pour cette agnelle de prairie.
[sounds]
bele = { files = ["sons/agneau-1.mp3"], volume = 0.8, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = "land"
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Docile : elle regarde ce qui la touche, ou appelle ; parfois un petit bond.
poke = [
    { to = "look", weight = 3 },
    { to = "bleat", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "sniff", weight = 1 },
]
window_side = "turn"
meet = [
    { to = "sniff", weight = 5 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 2 },
    { to = "gambol", weight = 2 },
    { to = "play_back", weight = 1, when = "lively" },
]
together = "pronk"
leave = "hop"
# Une alerte : elle appelle et rejoint vite le troupeau ; pas une charge.
startle = [
    { to = "look", weight = 3 },
    { to = "bleat", weight = 2 },
    { to = "run", weight = 2 },
    { to = "hop", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.0, 3.0]
next = [
    { to = "walk", weight = 5 },
    { to = "graze", weight = 3 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 3 },
    { to = "trot", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 2 },
    # Les jeux sont spontanés, même sans le réglage « actif » : huit semaines
    # se situe au deuxième pic de jeu (fiche § 8.2), surtout des sauts chez
    # les femelles. Les poids restent un choix de rythme pour le bureau.
    { to = "pronk", weight = 2 },
    { to = "gambol", weight = 3 },
    { to = "pivot", weight = 2 },
    { to = "race", weight = 2 },
    { to = "gambol", weight = 2, when = "morning" },
    { to = "race", weight = 2, when = "morning" },
    { to = "gambol", weight = 3, when = "evening" },
    { to = "race", weight = 3, when = "evening" },
    { to = "look", weight = 4, when = "cursor_near:220" },
    { to = "pronk", weight = 2, when = "lively" },
    { to = "gambol", weight = 3, when = "lively" },
    { to = "pivot", weight = 2, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "ruminate", weight = 2, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
    { to = "sit", weight = 3, when = "typing" },
    { to = "graze", weight = 2, when = "typing" },
    { to = "sit", weight = 6, when = "night" },
]

# Elle broute déjà à huit semaines, mais par séquences plus brèves qu'une
# brebis adulte ; elle tète encore dans la nature (fiche § 8.3 et § 8.6).
[[behavior]]
name = "graze"
motion = "graze"
duration = [3.0, 8.0]
sound = { name = "broute", chance = 0.3 }
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "look", weight = 2 },
    { to = "sit", weight = 2 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

[[behavior]]
name = "look"
motion = "look"
duration = [1.2, 3.0]
contagious = 0.25
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "trot", weight = 1 },
    { to = "bleat", weight = 2 },
    { to = "sit", weight = 1 },
]

# Vitesses du Mannequin × 25,6 / 29 : mêmes allures rapportées aux longues
# pattes de l'agneau ; petits pas rapides puis trot léger et galop court.
[[behavior]]
name = "walk"
motion = "walk"
speed = 40.6
duration = [2.0, 6.0]
contagious = 0.35
next = [
    { to = "stand", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "trot", weight = 2 },
    { to = "race", weight = 1 },
    { to = "sit", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 70.6
duration = [1.5, 3.5]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "race", weight = 2 }]

[[behavior]]
name = "run"
motion = "run"
speed = 132.4
duration = [0.8, 1.8]
contagious = 0.5
next = [{ to = "look", weight = 3 }, { to = "bleat", weight = 2 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.3
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "look", weight = 1 }]

# Le repos reste fréquent entre deux courses ; pattes repliées sur le
# sternum. Le moteur peut la blottir sur le dos d'une voisine couchée.
[[behavior]]
name = "sit"
motion = "sit"
duration = [6.0, 14.0]
next = [
    { to = "stand", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 2 },
    { to = "sleep", weight = 3 },
    { to = "sleep", weight = 8, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# La rumination est déjà présente après un mois à un mois et demi ; elle
# reste plus brève ici que celle des brebis adultes (fiche § 8.5).
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [6.0, 12.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stand", weight = 2 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [25.0, 60.0]
next = "sit"

# Élans réduits comme la racine de la hauteur par rapport au Mannequin
# (sqrt(28,714 / 54) ≈ 0,729) : les bonds restent à l'échelle de son corps.
[[behavior]]
name = "hop"
motion = "jump"
jump = [51.0, 315.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [81.0, 176.0]
duration = "forever"

# Plusieurs bonds raides peuvent s'enchaîner après la course.
[[behavior]]
name = "pronk"
motion = "pronk"
jump = [18.0, 308.0]
duration = "forever"
contagious = 0.4
on_land = [{ to = "land", weight = 3 }, { to = "pronk", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [29.0, 278.0]
duration = "forever"
contagious = 0.45
on_land = [
    { to = "land", weight = 3 },
    { to = "gambol", weight = 3 },
    { to = "pivot", weight = 2 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 220.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 2 }, { to = "race", weight = 1 }]

# La course contagieuse en aller-retour, un grand jeu des bandes d'agneaux.
[[behavior]]
name = "race"
motion = "run"
speed = 124.0
duration = [1.0, 1.8]
contagious = 0.6
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 3 }, { to = "gambol", weight = 2 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.3
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }, { to = "pivot", weight = 1 }]

# Les invitations sont reconnues par le moteur. Les coups de front restent
# courts et peu fréquents dans les rencontres d'une agnelle (fiche § 8.2).
[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 3 }, { to = "gambol", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "play_back"
motion = "back"
speed = 23.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 97.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 2 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [{ to = "shake", weight = 2 }, { to = "gambol", weight = 3 }, { to = "pivot", weight = 2 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 4 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.5 }

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [{ to = "sit", weight = 4 }, { to = "stand", weight = 2 }, { to = "sit", weight = 12, when = "away" }]

# Appel aigu à la mère : tête levée, cou en avant, bouche grande ouverte.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.9
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 1.8]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }, { to = "bleat", weight = 2 }]

# Les gestes ci-dessous permettent aussi d'inspecter le rig. L'agnelle ne
# fait pas spontanément le flehmen ni le cabré d'un bélier : aucune suite
# ordinaire ne mène à ces deux comportements.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 9.0]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }]

[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [{ to = "look", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Le réglage « énervé » peut faire gratter le sol puis jouer du front ;
# même là, elle renonce le plus souvent, sans séquence de combat d'adulte.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.0, 1.8]
next = [{ to = "stand", weight = 4 }, { to = "play_back", weight = 1 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 30.0
duration = [1.0, 1.6]
next = [{ to = "stand", weight = 3 }, { to = "play_lunge", weight = 1 }]

[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "stand"

[[behavior]]
name = "charge"
motion = "charge"
speed = 150.0
duration = [0.7, 1.2]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.3
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
