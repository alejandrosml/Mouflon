# Thônes et Marthod : un bélier de quatre ans en toison d'été, dessiné en
# vecteurs d'après la fiche de la race (docs/races/thones-et-marthod.md ;
# voir thones-et-marthod.svg). Le comportement part de celui du Mannequin
# (docs/animation-animale.md), réglé pour une race de montagne « très calme »,
# docile et grégaire (fiche, § 8) : il broute longtemps, rumine couché,
# marche d'un pas long et sûr, s'inquiète vite seul (le loup, le lynx) mais
# fuit peu ; bélier, il renifle les brebis, fait le flehmen et peut cogner du
# front, sans être agressif.

[pet]
id = "thones-et-marthod"
name = "Thônes et Marthod"
author = "Alejandro San Martin Lamas"
description = "La Thônes et Marthod, race de montagne savoyarde : un bélier en toison bouclée, lunettes noires séparées du museau noir, oreilles et chaussettes noires, cornes brun caramel en large spirale. Très calme, bon marcheur."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "thones-et-marthod.svg"
# 0,5 point par cm : 76 cm au garrot, 103,5 cm du sol au haut des cornes (le
# dessin est à 1 unité = 1 cm) : 0,5 × 103,5.
height = 51.8          # hauteur affichée, en points

[physics]
width = 60.0           # du bout du nez à l'arrière de la culotte : 120 cm (la tête se porte loin devant)
stride = 39.2          # 1,6 × la longueur des pattes (49 cm de l'épaule au sol)

# Les sons (domaine public, voir CREDITS.md). `mouth = true` : c'est sa voix,
# il ouvre la bouche en la faisant entendre. Pas de sonnaille : les photos
# n'en montrent que sur des brebis (fiche, § 8.4).
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
# Montagnard au pied sûr (il pose les pieds sur des dalles étroites, P14) :
# au bord d'une fenêtre, il descend un peu plus souvent que le Mannequin.
edge = [{ to = "turn", weight = 4 }, { to = "hop_down", weight = 1.5 }]
wall = "turn"
# Docile : un clic le fait regarder ou bêler plus que sauter.
poke = [
    { to = "look", weight = 3 },
    { to = "bleat", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "sniff", weight = 1 },
    { to = "stamp", weight = 2, when = "rowdy" },
]
window_side = "turn"
# Deux moutons qui se croisent se reniflent ; un bélier actif joue parfois à
# cogner du front.
meet = [
    { to = "sniff", weight = 5 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 3, when = "lively" },
]
together = "pronk"
leave = "hop"
# Le pointeur qui file : il lève la tête (un mouton seul reste aux aguets,
# § 8.2), tape parfois du pied, détale rarement.
startle = [
    { to = "look", weight = 5 },
    { to = "stamp", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "run", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Rustique, il hiverne parfois dehors (S2) : il tourne le dos au vent, puis se
# protège, tête basse.
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [2.0, 5.0]
next = [
    { to = "walk", weight = 6 },
    { to = "graze", weight = 7 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 3 },
    { to = "trot", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 4, when = "cursor_near:220" },
    { to = "paw", weight = 2, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 2, when = "lively" },
    # « Très calme » (S2) : il se couche volontiers pour ruminer.
    { to = "ruminate", weight = 4, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute longtemps (en estive, de longues heures au pâturage, § 8.2) ; un pas
# de temps en temps vers l'herbe suivante.
[[behavior]]
name = "graze"
motion = "graze"
duration = [6.0, 16.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Aux aguets : la tête haute, l'encolure à 50°, le regard fixe et sérieux des
# lunettes (§ 8.3). En troupeau non gardé, l'alerte se propage (prédateurs).
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 4.0]
contagious = 0.25
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Bonne marcheuse (S2, S6) : un pas long et sûr, un peu plus vif que celui du
# Mannequin rapporté à ses pattes ; le troupeau suit.
[[behavior]]
name = "walk"
motion = "walk"
speed = 60.0
duration = [3.0, 9.0]
contagious = 0.3
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 104.0
duration = [2.0, 4.5]
next = [{ to = "walk", weight = 4 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Au galop ; il détale moins qu'un mouton farouche, mais les autres suivent.
[[behavior]]
name = "run"
motion = "run"
speed = 190.0
duration = [1.0, 2.4]
contagious = 0.4
next = [{ to = "stand", weight = 3 }, { to = "walk", weight = 3 }, { to = "trot", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.4
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Couché sur le sternum, tête haute (§ 8.3) : un coussin blanc d'où sortent
# la tête aux lunettes, les oreilles noires et les cornes.
[[behavior]]
name = "sit"
motion = "sit"
duration = [6.0, 14.0]
next = [
    { to = "stand", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 28.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [25.0, 60.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [75.0, 420.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [120.0, 250.0]
duration = "forever"

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

# --- Les jeux d'agneaux, chez les actifs : un bélier adulte et calme s'y met
# moins souvent que le Mannequin.

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [50.0, 390.0]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 310.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

[[behavior]]
name = "race"
motion = "run"
speed = 175.0
duration = [1.2, 2.2]
contagious = 0.4
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.4
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front : deux béliers qui se croisent reculent ensemble,
# s'élancent et se cognent (docs/animation-animale.md, § 5).
[[behavior]]
name = "play_back"
motion = "back"
speed = 34.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 140.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 1 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.4
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 2 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

# --- Les gestes sur place.

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêle, la bouche ouverte : un bêlement grave de bélier (§ 8.3).
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.9
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 1 },
    { to = "flehmen", weight = 2, when = "rowdy" },
]

# Le flehmen du bélier : après avoir flairé un autre mouton, l'encolure
# tendue, la tête relevée, la lèvre supérieure retroussée sur le bourrelet
# dentaire, il hume quelques secondes.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 10.0]   # 7 à 19 s chez le bélier (Bahadi 2023), raccourci pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "bleat", weight = 1 }]

# Tape du pied, tête haute : l'alarme.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 3 },
    { to = "stand", weight = 2 },
    { to = "run", weight = 1 },
    { to = "paw", weight = 1, when = "rowdy" },
]

# Gratte le sol, tête basse. Calme avec les humains (S15) : il renonce plus
# souvent qu'il ne charge.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "back_up", weight = 3 }, { to = "charge", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 38.0
duration = [1.0, 1.6]
next = [
    { to = "rear", weight = 4 },
    { to = "charge", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "charge", weight = 3, when = "rowdy" },
]

# Se cabre, comme tous les béliers (docs/animation-animale.md, § 5), puis
# retombe tête la première et charge.
[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

[[behavior]]
name = "charge"
motion = "charge"
speed = 190.0
duration = [0.8, 1.4]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.4
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [3.0, 6.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
