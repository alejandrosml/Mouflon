<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <!--
    Mannequin : personnage d'exemple de Mouflon, un mouton de profil.
    Il sert de modèle au contrat des rigs : remplace-le par ton propre dessin
    en gardant les mêmes id de groupes et de pivots.
    © 2026 Alejandro San Martin Lamas — MIT OR Apache-2.0
  -->
  <defs>
    <linearGradient id="wool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#dde3ee"/>
    </linearGradient>
    <linearGradient id="skin" gradientUnits="userSpaceOnUse" x1="0" y1="39.92" x2="0" y2="73.96">
      <stop offset="0" stop-color="#8f9bb7"/>
      <stop offset="1" stop-color="#6a7592"/>
    </linearGradient>
    <linearGradient id="leg-near" gradientUnits="userSpaceOnUse" x1="0" y1="84" x2="0" y2="108">
      <stop offset="0" stop-color="#7d89a6"/>
      <stop offset="1" stop-color="#636e8b"/>
    </linearGradient>
    <linearGradient id="leg-far" gradientUnits="userSpaceOnUse" x1="0" y1="84" x2="0" y2="108">
      <stop offset="0" stop-color="#6a7591"/>
      <stop offset="1" stop-color="#545e79"/>
    </linearGradient>
    <linearGradient id="ear-in" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcaab7"/>
      <stop offset="1" stop-color="#c48f9f"/>
    </linearGradient>
    <linearGradient id="sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e8f1"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#3a3445"/>
      <stop offset="1" stop-color="#120f18"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f29ab0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f29ab0" stop-opacity="0"/>
    </radialGradient>
  </defs>

