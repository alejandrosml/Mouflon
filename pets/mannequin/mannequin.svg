      <ellipse cx="117.31" cy="50.59" rx="4.51" ry="5.06" transform="rotate(-12 117.31 50.59)" fill="url(#sclera)"/>
      <g id="pupils">
        <circle cx="118.14" cy="51.05" r="3.27" fill="url(#iris)"/>
        <circle cx="117.13" cy="49.49" r="1.15" fill="#ffffff"/>
