    <path d="M66.69 81.73A3.2 3.2 0 0 0 60.81 80.18" fill="none" stroke="#c9d0de" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M49.15 70.55A3.2 3.2 0 0 0 43.13 71.41" fill="none" stroke="#c9d0de" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M82.51 87.99A3.2 3.2 0 0 0 76.8 85.86" fill="none" stroke="#c9d0de" stroke-width="1.1" stroke-linecap="round"/>
