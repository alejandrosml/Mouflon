# Suffolk : un bélier britannique de trois ans, en octobre, quatre mois et
# demi après la tonte (3 à 4 cm de laine), d'après docs/races/suffolk.md.
# Les comportements du Mannequin sont conservés, réglés sur la fiche (§ 8) :
# grand animal calme, placide, qui pâture longtemps et surveille peu. Le
# troupeau reste lâche au repos ; une fuite courte le rassemble, puis il se
# retourne pour regarder. Les poids et durées sont des choix d'animation,
# pas des mesures publiées propres au Suffolk. Les jeux restent possibles
# chez les actifs, mais les bonds sont rares chez ce bélier de 130 kg.

[pet]
id = "suffolk"
name = "Suffolk"
author = "Alejandro San Martin Lamas"
description = "Le Suffolk britannique : un grand bélier sans cornes, au corps long et profond, laine crème serrée, tête busquée et pattes noires nues, longues oreilles tombantes. Calme, il broute et rumine longtemps."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"

[appearance]
rig = "suffolk.svg"
# 0,5 point par cm : 85 cm au garrot, 103,0 cm du sol au sommet du crâne
# (le dessin est à 1 unité = 1 cm) : 0,5 × 103,0.
height = 51.5

[physics]
width = 74.5           # environ 149 cm du bout du nez à l'arrière de la fesse
stride = 43.2          # 1,6 × 27 points : 54 cm de l'épaule au sol à 0,5 pt/cm

# Sons du Mannequin, copiés sans modification (domaine public, déjà crédités
# dans CREDITS.md). Répertoire ordinaire du mouton : pas de cri Suffolk
# particulier attesté (§ 8.5), pas de sonnaille dans l'individu choisi.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.65, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
# Un lourd bélier de plaine préfère se retourner au bord plutôt que bondir.
edge = [{ to = "turn", weight = 12 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Maniable : il lève d'abord la tête, puis reprend sa pâture.
poke = [
    { to = "look", weight = 6 },
    { to = "bleat", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "hop", weight = 0.2 },
    { to = "stamp", weight = 1, when = "rowdy" },
]
window_side = "turn"
meet = [
    { to = "sniff", weight = 6 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    # En lutte, le bélier peut reculer et cogner du front (§ 8.5).
    { to = "play_back", weight = 2, when = "lively" },
]
# Les commandes de jeu du moteur gardent accès aux sauts.
together = "pronk"
leave = "hop"
# Moins vigilant qu'une race de colline : regarde, trotte brièvement ;
# presque jamais un bond de peur (§ 8.1-8.2).
startle = [
    { to = "look", weight = 6 },
    { to = "trot", weight = 2 },
    { to = "stamp", weight = 1 },
    { to = "run", weight = 0.5 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

# Il pâture et rumine plus volontiers qu’il ne surveille (§ 8.1).
[[behavior]]
name = "stand"
motion = "stand"
duration = [2.5, 6.0]
next = [
    { to = "graze", weight = 10 },
    { to = "walk", weight = 4 },
    { to = "sit", weight = 4 },
    { to = "look", weight = 1 },
    { to = "trot", weight = 0.5 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 0.7 },
    { to = "look", weight = 4, when = "cursor_near:220" },
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "pronk", weight = 0.2, when = "lively" },
    { to = "gambol", weight = 0.2, when = "lively" },
    { to = "pivot", weight = 0.1, when = "lively" },
    { to = "race", weight = 0.3, when = "lively" },
    { to = "race", weight = 0.5, when = ["lively", "evening"] },
    { to = "trot", weight = 1, when = "lively" },
    { to = "ruminate", weight = 5, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Pâture de plaine : de longues stations, quelques bouchées, un pas et
# on recommence. Les longues oreilles pendent vers l’herbe (§ 8.2 et 8.5).
[[behavior]]
name = "graze"
motion = "graze"
duration = [8.0, 20.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "sit", weight = 2 },
    { to = "look", weight = 0.5 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Un coup d’œil bref, peu contagieux, puis il se remet à brouter. La
# faible vigilance suit la fiche ; les chiffres restent un choix d’animation.
[[behavior]]
name = "look"
motion = "look"
duration = [1.2, 2.8]
contagious = 0.15
next = [
    { to = "graze", weight = 6 },
    { to = "stand", weight = 3 },
    { to = "walk", weight = 2 },
    { to = "sit", weight = 2 },
    { to = "bleat", weight = 0.5 },
]

# Pas longs, réguliers et sûrs (§ 8.5). Vitesses du Mannequin ramenées
# aux pattes (43,2 / 29), un peu ralenties pour ce lourd adulte. Au repos,
# les voisins se suivent peu : le troupeau reste lâche (§ 8.2, estimation).
[[behavior]]
name = "walk"
motion = "walk"
speed = 62.0
duration = [2.5, 7.0]
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "graze", weight = 6 },
    { to = "look", weight = 1 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 0.5 },
]

# Trot lourd et court : après l’alerte, il s’arrête et se retourne
# pour regarder (§ 8.2), ou revient au pas.
[[behavior]]
name = "trot"
motion = "walk"
speed = 112.0
duration = [1.2, 3.0]
next = [{ to = "walk", weight = 3 }, { to = "flee_turn", weight = 3 }, { to = "stand", weight = 2 }]

# Rare fuite au galop, brève et en groupe. Ensuite, demi-tour et
# regard ; pas de saut de panique (§ 8.2).
[[behavior]]
name = "run"
motion = "run"
speed = 195.0
duration = [0.8, 1.8]
contagious = 0.4
next = "flee_turn"

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.45
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "graze", weight = 3 }]

# Au milieu du jour, couché sur le sternum, les pattes repliées, il
# rumine longtemps ; il se relève par l’arrière d’abord (§ 8.4).
[[behavior]]
name = "sit"
motion = "sit"
duration = [8.0, 18.0]
next = [
    { to = "stand", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 6 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# La mâchoire roule, tête haute, au repos (§ 8.4).
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [16.0, 32.0]
next = [
    { to = "sit", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 8, when = "away" },
]

# Le sommeil du moteur : couché, la tête parfois posée au sol.
[[behavior]]
name = "sleep"
motion = "sleep"
duration = [25.0, 60.0]
next = [{ to = "sit", weight = 1 }]

# Les bonds restent accessibles aux commandes de jeu, avec un élan
# réduit pour le lourd bélier adulte ; il les choisit très rarement seul.
[[behavior]]
name = "hop"
motion = "jump"
jump = [65.0, 330.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [105.0, 230.0]
duration = "forever"

# Jeux d’agneaux conservés pour les actifs et les commandes du moteur ;
# faible contagion chez cet adulte placide.
[[behavior]]
name = "pronk"
motion = "pronk"
jump = [0.0, 310.0]
duration = "forever"
contagious = 0.1

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [45.0, 320.0]
duration = "forever"
contagious = 0.1
on_land = [
    { to = "land", weight = 8 },
    { to = "gambol", weight = 0.5 },
    { to = "pivot", weight = 0.5 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 280.0]
duration = "forever"
on_land = [{ to = "land", weight = 8 }, { to = "gambol", weight = 0.5 }, { to = "race", weight = 1 }]

# Courte course de jeu, surtout chez les actifs ; il s’arrête plus
# souvent qu’il ne recommence à bondir.
[[behavior]]
name = "race"
motion = "run"
speed = 175.0
duration = [1.0, 2.0]
contagious = 0.25
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 0.5 }, { to = "stand", weight = 5 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.45
next = [{ to = "race", weight = 1 }, { to = "stand", weight = 3 }]

# Les béliers reculent brièvement avant les coups de front (§ 8.5).
[[behavior]]
name = "play_back"
motion = "back"
speed = 36.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 145.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 4 }, { to = "sniff", weight = 2 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "gambol", weight = 0.3 },
    { to = "stand", weight = 4 },
]

# L’invitation au jeu reste disponible au moteur des rencontres.
[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 4 }, { to = "gambol", weight = 0.5 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.4
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

# Une chute rude : il se remet du choc, puis s’ébroue.
[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

# S’ébroue : la toison courte et serrée tressaille peu (§ 8.5).
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

# S’étire après s’être relevé.
[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

# Se gratte d’un sabot arrière.
[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

# Bâille, puis se couche volontiers quand l’utilisateur s’absente.
[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêlement ordinaire du mouton, bouche ouverte ; les enregistrements
# du Mannequin ne prétendent pas restituer la voix grave de ce bélier.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.9
sound = "bele"
next = [{ to = "stand", weight = 3 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

# En octobre, le bélier en lutte flaire puis fait le flehmen. Le
# moteur ne distingue pas encore les sexes du voisin (§ 8.4-8.5).
[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 3 },
    { to = "bleat", weight = 0.5 },
    { to = "flehmen", weight = 1 },
    { to = "flehmen", weight = 2, when = "rowdy" },
]

# Lèvre retroussée sur le bourrelet dentaire, quelques secondes : le
# répertoire du bélier ; aucun son particulier attesté pour le Suffolk.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [7.0, 11.0]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 3 }]

# Une alarme modérée : il regarde avant de décider de fuir.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 4 },
    { to = "stand", weight = 2 },
    { to = "trot", weight = 1 },
    { to = "paw", weight = 1, when = "rowdy" },
]

# Maniable, mais bélier : il peut gratter, reculer puis charger. Le
# plus souvent, il renonce plutôt que d’attaquer.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "back_up", weight = 3 }, { to = "charge", weight = 1 }, { to = "stand", weight = 4 }]

# Court recul, sans se retourner, avant de cogner du front (§ 8.5).
# Le cabré du Mannequin reste présent mais rare.
[[behavior]]
name = "back_up"
motion = "back"
speed = 38.0
duration = [0.8, 1.3]
next = [
    { to = "rear", weight = 0.5 },
    { to = "charge", weight = 4 },
    { to = "stand", weight = 3 },
    { to = "charge", weight = 2, when = "rowdy" },
]

# Geste du Mannequin conservé, choisi rarement par cet adulte lourd.
[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

# Charge brève, tête basse, sans cornes : choc du front.
[[behavior]]
name = "charge"
motion = "charge"
speed = 190.0
duration = [0.6, 1.1]
next = [{ to = "stand", weight = 3 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

# Sonné, puis il s’ébroue.
[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

# Tourne le dos au vent avant de se protéger, tête basse.
[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]

# Après la fuite : demi-tour, arrêt, puis il observe avant de rebrouter.
[[behavior]]
name = "flee_turn"
motion = "turn"
duration = 0.45
next = "look"
