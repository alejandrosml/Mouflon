# Nez noir du Valais : une brebis adulte en pleine toison, dessinée en
# vecteurs d'après le standard de la race (voir nez-noir.svg). Le
# comportement part de celui du Mannequin (docs/animation-animale.md),
# réglé pour une race calme, sociable et curieuse : elle broute, se couche
# et renifle plus volontiers, s'alarme et charge moins.

[pet]
id = "nez-noir"
name = "Nez noir du Valais"
author = "Alejandro San Martin Lamas"
description = "La brebis Nez noir du Valais, race de montagne suisse : longues mèches blanches ondulées, masque noir sous un toupet blanc, oreilles noires sous des cornes pâles en spirale, genoux, jarrets et bottes noirs. Calme et curieuse."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "nez-noir.svg"
# 0,5 point par cm : 75 cm au garrot, 108,4 cm du sol au haut du toupet
# (le dessin est à 1 unité = 1 cm) : 0,5 × 75 × 108,4 / 75.
height = 54.2          # hauteur affichée, en points

[physics]
width = 66.0           # du bout du nez à l'arrière de la croupe : 133 cm
stride = 36.8          # 1,6 × la longueur des pattes (46 cm de l'épaule au sol)

[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Curieuse : un clic la fait regarder, bêler ou renifler plus que sauter.
poke = [
    { to = "look", weight = 3 },
    { to = "bleat", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "stamp", weight = 2, when = "rowdy" },
]
window_side = "turn"
# Deux brebis qui se croisent se reniflent ; les jeunes jouent parfois.
meet = [
    { to = "sniff", weight = 6 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 2, when = "lively" },
]
together = "pronk"
leave = "hop"
# Peu farouche : le pointeur qui file la fait surtout lever la tête.
startle = [
    { to = "look", weight = 5 },
    { to = "stamp", weight = 1 },
    { to = "hop", weight = 1 },
    { to = "run", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [2.0, 5.0]
next = [
    { to = "walk", weight = 5 },
    { to = "graze", weight = 7 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 3 },
    { to = "trot", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    # Curieuse : le pointeur tout près l'attire.
    { to = "look", weight = 5, when = "cursor_near:220" },
    { to = "paw", weight = 2, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 2, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 1, when = "lively" },
    { to = "ruminate", weight = 4, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute longtemps, la tête au sol ; un pas de temps en temps.
[[behavior]]
name = "graze"
motion = "graze"
duration = [6.0, 16.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 3 },
    { to = "look", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Aux aguets, la tête levée ; l'alerte se propage moins chez une race calme.
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 4.0]
contagious = 0.2
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Un pas posé et sûr ; le troupeau suit.
[[behavior]]
name = "walk"
motion = "walk"
speed = 54.0
duration = [3.0, 8.0]
contagious = 0.3
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 96.0
duration = [2.0, 4.0]
next = [{ to = "walk", weight = 4 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

[[behavior]]
name = "run"
motion = "run"
speed = 185.0
duration = [1.0, 2.4]
contagious = 0.35
next = [{ to = "stand", weight = 3 }, { to = "walk", weight = 3 }, { to = "trot", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.4
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Couchée en boule de laine, les pattes sous elle ; souvent pour ruminer.
[[behavior]]
name = "sit"
motion = "sit"
duration = [6.0, 14.0]
next = [
    { to = "stand", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 28.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [25.0, 60.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [75.0, 420.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [125.0, 250.0]
duration = "forever"

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

# --- Les jeux d'agneaux, chez les actifs : moins souvent qu'au Mannequin.

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [50.0, 390.0]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 310.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

[[behavior]]
name = "race"
motion = "run"
speed = 170.0
duration = [1.2, 2.2]
contagious = 0.4
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.4
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front, pour jouer.
[[behavior]]
name = "play_back"
motion = "back"
speed = 33.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 135.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.4
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 2 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

# --- Les gestes sur place.

# S'ébroue : la grande toison ondule de la tête à la queue.
[[behavior]]
name = "shake"
motion = "shake"
duration = 1.0
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.6]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "sit", weight = 12, when = "away" },
]

[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Renifle, le museau tendu : elle s'intéresse à tout.
[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.2, 2.4]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 0.4 },
]

# Le flehmen, rare chez une brebis : l'encolure tendue, la tête relevée, la
# lèvre supérieure retroussée, quelques secondes.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 10.0]   # 7 à 19 s chez le bélier (Bahadi 2023), raccourci pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 3 },
    { to = "stand", weight = 2 },
    { to = "run", weight = 1 },
    { to = "paw", weight = 1, when = "rowdy" },
]

# Une brebis calme ne charge presque jamais : elle gratte le sol, puis le
# plus souvent renonce.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.0, 2.0]
next = [{ to = "back_up", weight = 2 }, { to = "charge", weight = 1 }, { to = "stand", weight = 3 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 40.0
duration = [1.0, 1.6]
next = [{ to = "rear", weight = 2 }, { to = "charge", weight = 1 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

[[behavior]]
name = "charge"
motion = "charge"
speed = 200.0
duration = [0.7, 1.2]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.4
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [3.0, 6.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
