# Dorper : bélier sud-africain adulte, après la mue, à poil ras.
# Modèle de comportement : le Mannequin, réglé d’après docs/races/dorper.md
# (§ 8). Calme et facile à conduire, il broute longtemps en se déplaçant peu,
# rumine couché et marche d’un pas court et posé. Le jeu demeure disponible
# pour les tempéraments actifs ; il ne se cabre pas avant de charger.
# Les préférences et durées sont des réglages de bureau, pas des mesures
# comportementales publiées pour la race.

[pet]
id = "dorper"
name = "Dorper"
author = "Alejandro San Martin Lamas"
description = "Le Dorper, bélier sud-africain calme : un corps blanc massif à poil ras, tête et cou noirs, museau plissé, oreilles horizontales, petit moignon corné et courtes pattes blanches aux onglons noirs."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"

[appearance]
rig = "dorper.svg"
# 0,5 point par cm : 70 cm au garrot, 94,48 cm du sol au sommet
# du dessin, contours compris (1 unité = 1 cm ; limites mesurées du rig).
height = 47.23933

[physics]
# Largeur entière, queue comprise : 0,5 × 137,16454 cm ; les bords
# et les murs tiennent ainsi compte de toute la silhouette.
width = 68.58227
stride = 37.6 # 1,6 × 0,5 × 47 cm de l’épaule au sol

# Sons du Mannequin, découpés dans des enregistrements du domaine public
# (CREDITS.md). Aucune voix propre à la race n'est documentée ; pas de sonnaille.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 7 }, { to = "hop_down", weight = 1 }]
wall = "turn"
poke = [
    { to = "look", weight = 5 },
    { to = "bleat", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "stamp", weight = 2, when = "rowdy" },
]
window_side = "turn"

meet = [
    { to = "sniff", weight = 6 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 2, when = "lively" },
]
together = "pronk"
leave = "hop"

startle = [
    { to = "look", weight = 6 },
    { to = "stamp", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "run", weight = 1 },
]

sleepy = "yawn"

wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]

wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

# Calme et docile (fiche § 8.1) : il reste posé, broute ou se couche ;
# les jeux et menaces dépendent du tempérament choisi dans l’app.
[[behavior]]
name = "stand"
motion = "stand"
duration = [3.0, 7.0]
next = [
    { to = "walk", weight = 3 },
    { to = "graze", weight = 7 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 4 },
    { to = "trot", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 4, when = "cursor_near:220" },

    { to = "paw", weight = 2, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 2, when = "lively" },
    { to = "ruminate", weight = 5, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Peu sélectif, il marche peu entre deux bouchées : des séquences longues,
# sans multiplier les déplacements (fiche § 8.1, Brand 2000). Le moteur
# actuel ne distingue pas le broutage des buissons de celui de l’herbe.
[[behavior]]
name = "graze"
motion = "graze"
duration = [10.0, 24.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 1 },
    { to = "look", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Vigilance commune aux moutons : tête haute et oreilles orientées ;
# elle peut gagner le groupe (fiche § 8.2, estimation).
[[behavior]]
name = "look"
motion = "look"
duration = [2.0, 4.0]
contagious = 0.3
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Pas court, posé et régulier ; le groupe le suit. Les vitesses restent
# proportionnées aux pattes pour que le moteur choisisse le pas puis le trot.
[[behavior]]
name = "walk"
motion = "walk"
speed = 48.0
duration = [2.5, 6.0]
contagious = 0.3
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 5 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 84.0
duration = [1.5, 3.5]
next = [{ to = "walk", weight = 5 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Un galop court et rare chez ce bélier lourd (fiche § 8.2, estimation).
[[behavior]]
name = "run"
motion = "run"
speed = 155.0
duration = [0.8, 1.8]
contagious = 0.35
next = [{ to = "stand", weight = 3 }, { to = "walk", weight = 2 }, { to = "trot", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Repos sternal et rumination prolongée ; la posture est celle du moteur.
[[behavior]]
name = "sit"
motion = "sit"
duration = [8.0, 18.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 5 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [14.0, 32.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [25.0, 60.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [65.0, 370.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [95.0, 220.0]
duration = "forever"

# Les jeux du Mannequin restent disponibles pour un tempérament actif
# ou la commande « Tous ensemble » ; ils ne décrivent pas un trait de race.
[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.2

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [35.0, 350.0]
duration = "forever"
contagious = 0.2
on_land = [
    { to = "land", weight = 5 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 280.0]
duration = "forever"
on_land = [{ to = "land", weight = 4 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

[[behavior]]
name = "race"
motion = "run"
speed = 145.0
duration = [1.0, 1.8]
contagious = 0.3
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 3 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 3 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Deux béliers actifs peuvent reculer et donner un bref coup de front
# (fiche § 8.1–8.2). Pas de cabré : il n’est pas documenté chez le Dorper.
[[behavior]]
name = "play_back"
motion = "back"
speed = 26.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 125.0
duration = 0.65
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "stand", weight = 4 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "sit", weight = 12, when = "away" },
]

# Les enregistrements communs n’imitent aucune voix propre au Dorper.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Le bélier flaire ses voisins ; le flehmen est plus fréquent s’il est
# énervé, d’après les observations de rang social (fiche § 8.1).
[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 1.8]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 1 },
    { to = "flehmen", weight = 2, when = "rowdy" },
]

# La lèvre se retrousse et le bourrelet dentaire apparaît ; les durées
# viennent des observations générales des béliers (Mannequin).
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [7.0, 12.0]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "bleat", weight = 1 }]

[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "run", weight = 1 },
    { to = "paw", weight = 2, when = "rowdy" },
]

# La menace aboutit souvent à un retour au calme ; les animaux agressifs
# ne sont pas recherchés par les standards (fiche § 8.1).
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "back_up", weight = 3 }, { to = "charge", weight = 1 }, { to = "stand", weight = 4 }]

# Bref recul sans se retourner ; il charge directement, sans se cabrer.
[[behavior]]
name = "back_up"
motion = "back"
speed = 30.0
duration = [0.8, 1.3]
next = [
    { to = "stand", weight = 3 },
    { to = "charge", weight = 2 },

    { to = "charge", weight = 5, when = "rowdy" },
]

[[behavior]]
name = "charge"
motion = "charge"
speed = 155.0
duration = [0.6, 1.0]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
