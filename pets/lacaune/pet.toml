# Lacaune : une brebis Lacaune lait (rayon de Roquefort) de trois à quatre
# ans, en juin, tondue à la mi-mai, en pleine traite, dessinée en vecteurs
# d'après la fiche de la race (docs/races/lacaune.md ; voir lacaune.svg). Le
# comportement part de celui du Mannequin (docs/animation-animale.md), réglé
# sur la fiche (§ 8) : une brebis vive et attentive, plutôt calme dans la
# routine mais prompte à partir en bloc ; très grégaire (grands troupeaux,
# broutage en front serré, sieste en tas à l'ombre) ; tout le troupeau lève
# la tête au moindre appel. Pas une brebis de compagnie, pas un mouflon
# farouche ; une brebis ne charge presque jamais et fait rarement le flehmen.

[pet]
id = "lacaune"
name = "Lacaune"
author = "Alejandro San Martin Lamas"
description = "La brebis Lacaune, laitière du roquefort : grande, blanche, tondue court, longues pattes, long cou, tête busquée sans cornes, oreilles à l'horizontale, grosse mamelle rose. Vive et grégaire."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "lacaune.svg"
# 0,5 point par cm : 70 cm au garrot, 87,8 cm du sol au haut des oreilles
# (le dessin est à 1 unité = 1 cm) : 0,5 × 87,8.
height = 43.9          # hauteur affichée, en points

[physics]
width = 57.6           # du bout du nez à l'arrière de la fesse : 115,3 cm
stride = 37.6          # 1,6 × la longueur des pattes (47 cm de l'épaule au sol)

# Les sons du Mannequin (domaine public, voir CREDITS.md) : le bêlement aigu,
# bouche ouverte, de la brebis séparée du troupeau ou qui attend la traite.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 5 }, { to = "hop_down", weight = 1 }]
wall = "turn"
# Attentive : un clic la fait d'abord lever la tête, ou bêler.
poke = [
    { to = "look", weight = 4 },
    { to = "bleat", weight = 2 },
    { to = "hop", weight = 1 },
    { to = "run", weight = 1 },
    { to = "stamp", weight = 1, when = "rowdy" },
]
window_side = "turn"
# Deux brebis qui se croisent se reniflent ; les jeunes jouent parfois.
meet = [
    { to = "sniff", weight = 5 },
    { to = "look", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 2, when = "lively" },
]
together = "pronk"
leave = "hop"
# Le pointeur qui file : elle lève la tête, ou part en bloc avec le troupeau.
startle = [
    { to = "look", weight = 4 },
    { to = "run", weight = 2 },
    { to = "stamp", weight = 1 },
    { to = "hop", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Le vent du causse : elle lui tourne le dos, puis se protège, tête basse.
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.0]
next = [
    { to = "walk", weight = 5 },
    # Le pâturage obligatoire du roquefort : elle broute beaucoup.
    { to = "graze", weight = 8 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
    { to = "hop", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 4, when = "cursor_near:220" },
    # Une brebis calme gratte rarement le sol ; les jeunes jouent un peu.
    { to = "paw", weight = 1, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 1, when = "lively" },
    # La sieste de midi : couchée, elle rumine.
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute : quelques bouchées, un ou deux pas, et recommencer (fiche § 8.5) ;
# les oreilles restent à l'horizontale.
[[behavior]]
name = "graze"
motion = "graze"
duration = [5.0, 14.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 2 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 3, when = "cursor_near:220" },
]

# Aux aguets : au moindre appel, tout le troupeau lève la tête en même temps
# (P5) : l'alerte se propage beaucoup.
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
contagious = 0.4
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

# Une allure vive et légère, à petits pas, « pour trottiner sur les
# cailloux » ; le troupeau suit, en file (vitesses du Mannequin mises à
# l'échelle de ses pattes : × 37,6 / 29).
[[behavior]]
name = "walk"
motion = "walk"
speed = 58.0
duration = [3.0, 8.0]
contagious = 0.35
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 104.0
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

# Au galop : une fuite courte en bloc, puis tout le monde se retourne.
[[behavior]]
name = "run"
motion = "run"
speed = 190.0
duration = [1.0, 2.4]
contagious = 0.55
next = [{ to = "turn", weight = 2 }, { to = "stand", weight = 2 }, { to = "look", weight = 2 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "look", weight = 1 }]

# Couchée sur le sternum, les pattes repliées sous elle ; elle se relève
# l'arrière d'abord. Au chaud de midi, couchée en tas à l'ombre.
[[behavior]]
name = "sit"
motion = "sit"
duration = [5.0, 12.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# Elle rumine couchée, la tête haute, la mâchoire qui roule.
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 26.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [75.0, 430.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [120.0, 245.0]
duration = "forever"

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

# --- Les jeux d'agneaux : chez une brebis adulte, rares mais présents.

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [45.0, 390.0]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 310.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

# La course : elles filent en bande jusqu'au bout, font demi-tour et
# reviennent (le troupeau qui part en bloc).
[[behavior]]
name = "race"
motion = "run"
speed = 175.0
duration = [1.2, 2.2]
contagious = 0.5
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front, pour jouer.
[[behavior]]
name = "play_back"
motion = "back"
speed = 32.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 135.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 2 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.5 }

# --- Les gestes sur place.

# S'ébroue : la robe courte frissonne de la tête à la queue.
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 2 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêle, bouche ouverte : séparée du troupeau, ou à l'heure de la traite.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 0.4 },
]

# Le flehmen, rare chez une brebis : l'encolure tendue, la tête relevée, la
# lèvre supérieure retroussée, quelques secondes.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [6.0, 9.0]   # 7 à 19 s chez le bélier (Bahadi 2023), raccourci pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Tape du pied, tête haute : l'alarme ; le troupeau regarde, puis part.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 3 },
    { to = "stand", weight = 1 },
    { to = "run", weight = 2 },
    { to = "paw", weight = 1, when = "rowdy" },
]

# Une brebis calme ne charge presque jamais : elle gratte le sol, puis le
# plus souvent renonce.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.0, 2.0]
next = [{ to = "back_up", weight = 2 }, { to = "charge", weight = 1 }, { to = "stand", weight = 3 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 40.0
duration = [1.0, 1.6]
next = [{ to = "rear", weight = 1 }, { to = "charge", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

[[behavior]]
name = "charge"
motion = "charge"
speed = 200.0
duration = [0.7, 1.2]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

# Le vent : elle lui tourne le dos, puis se protège, tête basse, serrée sur
# ses pattes.
[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
