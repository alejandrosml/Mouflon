# Bleu du Maine : une brebis adulte de trois à quatre ans, toison d'automne,
# tête et pattes nues bleu ardoise (docs/races/bleu-du-maine.md).
# Elle devient l'exemple complet du format : tous les gestes, réflexes et
# choix conditionnels du Mannequin sont conservés, y compris les jeux des
# actifs et les confrontations des énervés. Ce sont des possibilités du
# moteur, pas des observations propres à une brebis Bleu du Maine.
# Le réglage habituel suit la fiche (§ 8) : docile, herbagère, peu grégaire,
# elle broute longtemps, rumine couchée, marche au pas ; elle joue, fuit et
# charge rarement. Les probabilités sont des choix d'animation, pas des
# fréquences mesurées. Pas de cloche : aucun usage établi pour cette race.

[pet]
id = "bleu-du-maine"
name = "Bleu du Maine"
author = "Alejandro San Martin Lamas"
description = "Une brebis Bleu du Maine du bocage : grande toison crème, tête nue bleu ardoise, longues oreilles horizontales et fines pattes grises. Docile, elle broute et rumine tranquillement, sans entraîner tout le troupeau."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"     # sa famille : tous les moutons ensemble (et ils s'imitent)

[appearance]
rig = "bleu-du-maine.svg"
# 1 unité du dessin = 1 cm ; 0,5 point par cm. Garrot nu à 68 cm,
# Hauteur peinte mesurée par le moteur : 90,341 cm (bornes du rig,
# et non du viewBox), soit 0,5 × 90,341.
height = 45.1705       # hauteur affichée, en points

[physics]
width = 57.5           # 0,5 × 114,983 cm, de la queue au bout du museau
stride = 28.0          # 0,5 × 1,6 × 35 cm de l'épaule au sol

# Les sons (domaine public, voir CREDITS.md). `mouth = true` : c'est sa voix,
# elle ouvre la bouche en la faisant entendre.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

# Les réflexes gardent tous les choix du modèle complet. Une brebis docile
# regarde ou renifle d'abord ; elle saute et s'alarme peu (fiche § 8).
[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
# Race de plaine : elle fait presque toujours demi-tour au bord.
edge = [{ to = "turn", weight = 12 }, { to = "hop_down", weight = 0.5 }]
wall = "turn"
poke = [
    { to = "hop", weight = 0.5 },
    { to = "look", weight = 5 },
    { to = "bleat", weight = 2 },
    { to = "stamp", weight = 0.5, when = "rowdy" },
]
window_side = "turn"
meet = [
    { to = "sniff", weight = 6 },
    { to = "look", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 0.5, when = "lively" },
]
together = "pronk"     # la commande « Tous ensemble » montre aussi les jeux
leave = "hop"
startle = [
    { to = "look", weight = 7 },
    { to = "stamp", weight = 0.5 },
    { to = "hop", weight = 0.5 },
    { to = "run", weight = 0.3 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Elle préfère l'abri aux intempéries (fiche § 8.2). Le format ne règle
# pas l'abri par race ; ce réflexe ne concerne que le vent reçu de face.
wind = [{ to = "turn_away", weight = 5, when = "into_wind" }, { to = "brace", weight = 2 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [2.5, 6.0]
next = [
    { to = "walk", weight = 4 },
    { to = "graze", weight = 10 },
    { to = "look", weight = 2 },
    { to = "sit", weight = 4 },
    { to = "trot", weight = 0.4 },
    { to = "run", weight = 0.1 },
    { to = "hop", weight = 0.15 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 2, when = "cursor_near:220" },
    # Selon le tempérament choisi dans l'app : les jeux restent accessibles
    # aux actifs, les gestes de confrontation aux énervés ; au naturel,
    # cette brebis préfère l'herbe et la rumination (fiche § 8).
    { to = "paw", weight = 0.3, when = "rowdy" },
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },   # les agneaux courent surtout le soir
    { to = "trot", weight = 1, when = "lively" },
    { to = "ruminate", weight = 5, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Broute : la tête descend au sol, une bouchée par seconde ; de temps en
# temps, un pas en avant vers l'herbe suivante, sans lever la tête.
[[behavior]]
name = "graze"
motion = "graze"
duration = [7.0, 18.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "look", weight = 1.5, when = "cursor_near:220" },
]

# Aux aguets : elle lève la tête ; ses voisines l'imitent peu (§ 8.1).
# Le format ne règle pas l'écart entre les brebis pour chaque race :
# la faible contagion traduit ici le peu de grégarisme par l'imitation.
[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
contagious = 0.1
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "graze", weight = 3 },
]

# Elle marche tranquillement. « Elles ne sont pas grégaires » (OS, fiche
# § 8.1) : ses voisines l'imitent moins que le Mannequin. Les vitesses sont
# rapportées à stride = 28 pt, voisin des 29 pt du modèle.
[[behavior]]
name = "walk"
motion = "walk"
speed = 42.0
duration = [3.0, 8.0]
contagious = 0.1
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 5 },
    { to = "look", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 1 },
    { to = "run", weight = 0.2 },
]

# Au trot, les pattes vont par paires diagonales (le moteur choisit
# l'allure d'après la vitesse rapportée à la longueur des pattes).
[[behavior]]
name = "trot"
motion = "walk"
speed = 77.0
duration = [1.2, 3.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 0.2 }]

# Galop transverse rare et bref ; l'imitation reste faible (fiche § 8.3).
[[behavior]]
name = "run"
motion = "run"
speed = 145.0
duration = [0.8, 1.6]
contagious = 0.15
next = [{ to = "stand", weight = 5 }, { to = "walk", weight = 2 }, { to = "trot", weight = 0.5 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }]

# Couchée : l'avant se plie d'abord, les pattes se replient sous la toison ;
# elle se relève l'arrière d'abord, puis s'étire.
[[behavior]]
name = "sit"
motion = "sit"
duration = [6.0, 15.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 5 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

# Elle rumine, couchée : elle mâche un bol, l'avale, une pause, le suivant.
[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [14.0, 32.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

# Elle dort, couchée ; une fois sur deux, la tête posée au sol, le cou tendu.
# De temps en temps, une oreille ou une patte tressaille.
[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [65.0, 400.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [95.0, 220.0]
duration = "forever"

# Saut d'agneau : droit en l'air, les quatre pattes raides, la tête qui
# secoue. Les autres s'y mettent souvent.
[[behavior]]
name = "pronk"
motion = "pronk"
jump = [24.0, 410.0]
duration = "forever"
contagious = 0.1

# --- Les jeux d'agneaux, surtout chez les actifs (voir
# docs/animation-animale.md) : il se ramasse, puis bondit.

# Saut tordu : en l'air, le corps se tord, la tête part de l'autre côté, les
# pattes de derrière ruent (`twist`). Il en enchaîne souvent plusieurs.
[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [35.0, 365.0]
duration = "forever"
contagious = 0.1
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 0.5 },
    { to = "race", weight = 0.5 },
]

# Un petit bond sur place, en se retournant en l'air (`spin`).
[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 290.0]
duration = "forever"
on_land = [{ to = "land", weight = 4 }, { to = "gambol", weight = 0.5 }, { to = "race", weight = 0.5 }]

# Le mode actif garde la course de jeu, avec peu d'imitation : ce n'est
# pas le comportement habituel de cette brebis adulte.
[[behavior]]
name = "race"
motion = "run"
speed = 135.0
duration = [0.9, 1.6]
contagious = 0.15
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 3 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 3 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

# Coups de front : deux agneaux qui se croisent reculent ensemble (une durée
# fixe, pour repartir en même temps), s'élancent et se cognent le front ;
# l'élan prévoit la rencontre (`on_meet`), le choc les tasse tous les deux.
[[behavior]]
name = "play_back"
motion = "back"
speed = 25.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 105.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "gambol", weight = 0.5 },
    { to = "pivot", weight = 0.3 },
    { to = "stand", weight = 3 },
]

# L'invitation au jeu : il fixe un autre agneau, la tête et l'avant baissés,
# en sautillant. Le moteur la propose de lui-même, surtout aux actifs, quand
# un voisin de la famille est à deux ou trois longueurs ; l'autre accepte
# souvent, et ils s'élancent l'un vers l'autre (`play_lunge`).
[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 3 }, { to = "gambol", weight = 0.5 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

# Atterri rudement : un peu sonné, puis il s'ébroue.
[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.4 }

# --- Les gestes sur place. Le moteur les anime de lui-même (voir
# docs/format.md) ; `duration` dit combien de temps ils durent.

# S'ébroue : la secousse part de la tête et file jusqu'à la queue, six fois
# par seconde.
[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

# S'étire en se levant : le cou tendu, puis une patte arrière loin derrière.
[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

# Se gratte d'un sabot arrière.
[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

# Bâille : la tête se lève, la bouche s'ouvre grand, les yeux se ferment.
# Contagieux, comme chez nous. L'utilisateur parti, il va se coucher.
[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.08
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 2 },
    { to = "sit", weight = 12, when = "away" },
]

# Bêle, la bouche ouverte.
[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

# Renifle, le museau tendu (deux moutons qui se rencontrent).
[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 1.8]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 0.1 },
    { to = "flehmen", weight = 0.3, when = "rowdy" },
]

# Le flehmen : la lèvre se retrousse après avoir flairé. Geste surtout
# décrit chez le bélier, gardé ici comme exemple rare du format complet ;
# le réglage « énervé » le propose un peu plus souvent.
[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [7.0, 10.0]   # démonstration rare : durée du modèle, sans mesure propre à cette race
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "bleat", weight = 1 }]

# Tape du pied, tête haute : l'alarme des moutons.
[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 5 },
    { to = "stand", weight = 3 },
    { to = "run", weight = 0.5 },
    { to = "paw", weight = 0.3, when = "rowdy" },
]

# Gratte le sol, tête basse : geste conservé pour le format complet. Cette
# brebis docile renonce le plus souvent avant de prendre son élan.
[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "back_up", weight = 1 }, { to = "charge", weight = 0.2 }, { to = "stand", weight = 6 }]

# Recule sans se retourner, tête basse (`back` : il s'arrête au bord plutôt
# que d'en tomber à reculons).
[[behavior]]
name = "back_up"
motion = "back"
speed = 32.0
duration = [1.0, 1.6]
next = [
    { to = "stand", weight = 4 },
    { to = "rear", weight = 0.5 },
    { to = "charge", weight = 0.3 },
    # Le réglage « énervé » garde l'exemple de charge directe du format.
    { to = "charge", weight = 1, when = "rowdy" },
]

# Se cabre : l'avant se dresse sur les pattes de derrière, celles de devant
# repliées, puis retombe d'un coup, tête la première ; et il charge.
[[behavior]]
name = "rear"
motion = "rear"
duration = 1.15
next = "charge"

# Fonce, tête basse, oreilles couchées.
[[behavior]]
name = "charge"
motion = "charge"
speed = 165.0
duration = [0.7, 1.1]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

# Sonné : la tête tourne, les yeux mi-clos.
[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

# Le vent : elle lui tourne le dos, puis se protège, tête basse, oreilles
# couchées, serrée sur ses pattes.
[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [3.0, 6.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
