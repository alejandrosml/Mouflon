name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (moteur et rendu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    name: Bundle macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Signature Developer ID et notarisation, seulement pour les tags et si
      # les secrets sont configurés dans le dépôt (voir README, « Publier »).
      - name: Importer le certificat Developer ID
        if: startsWith(github.ref, 'refs/tags/') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          xcrun notarytool store-credentials mouflon \
            --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}"
          echo "SIGN_IDENTITY=${{ secrets.APPLE_SIGN_IDENTITY }}" >> $GITHUB_ENV
          echo "NOTARY_PROFILE=mouflon" >> $GITHUB_ENV

      - run: bash scripts/bundle-macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: Mouflon-macos-arm64
          path: dist/*.zip

      # Essai de cinq minutes : deux Lainou et deux Pelote en mode collisions ;
      # à mi-parcours, une Lainou s'en va et une autre arrive. L'app note
      # chaque image et chaque événement dans un journal, puis quitte. Un
      # plantage, même en quittant (ou un blocage : 7 minutes au plus), fait
      # échouer la construction ; l'app, déjà envoyée, reste téléchargeable.
      - name: Essai de cinq minutes
        run: |
          set -o pipefail
          export RUST_LOG=warn,mouflon=info,mouflon_core=info,mouflon_render=info
          MOUFLON_ESSAI=300 MOUFLON_ESSAI_ANIMAUX=lainou,lainou,pelote,pelote \
            MOUFLON_ESSAI_COLLISIONS=1 MOUFLON_JOURNAL=essai-journal.log \
            perl -e 'alarm 420; exec @ARGV' \
            dist/Mouflon.app/Contents/MacOS/mouflon 2>&1 | tee essai.log
          grep -q "essai terminé" essai.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: essai-journal
          path: |
            essai.log
            essai-journal.log

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
