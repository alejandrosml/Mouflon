name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (moteur et rendu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    name: Bundle macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Signature Developer ID et notarisation, seulement pour les tags et si
      # les secrets sont configurés dans le dépôt (voir README, « Publier »).
      - name: Importer le certificat Developer ID
        if: startsWith(github.ref, 'refs/tags/') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          xcrun notarytool store-credentials mouflon \
            --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}"
          echo "SIGN_IDENTITY=${{ secrets.APPLE_SIGN_IDENTITY }}" >> $GITHUB_ENV
          echo "NOTARY_PROFILE=mouflon" >> $GITHUB_ENV

      - run: bash scripts/bundle-macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: Mouflon-macos-arm64
          path: dist/*.zip

      # Essai de trois minutes, le même que sur un Mac (`tools/essai/Essai de
      # 3 minutes.command`) : une Lainou et une Pelote en mode collisions ; à
      # mi-parcours, l'une s'en va et une autre arrive. L'app note chaque
      # image, chaque événement, la pile du fil principal quand une image
      # tarde, les ressources du processus, de ses fils et du système ;
      # autour, `sample`, `top`, `log stream`, `vm_stat`, `pmset`, et
      # `footprint` vers la fin. Des instantanés de ce qui est à l'écran
      # (calques de la scène) vont dans instantanes/. Tout va dans
      # essais/<date>/, avec l'analyse (`analyse.txt`). Un plantage, même en
      # quittant (ou un blocage), fait échouer la construction ; l'app, déjà
      # envoyée, reste téléchargeable.
      - name: Essai de trois minutes
        run: |
          MOUFLON_ESSAI_CI=1 MOUFLON_ESSAI_INSTANTANES=1 perl -e 'alarm 480; exec @ARGV' \
            bash "tools/essai/Essai de 3 minutes.command" | tee essai-console.log
          grep -q "essai terminé" essais/*/sortie.log

      # La même chose en une minute, les animaux dessinés sur le GPU
      # (`MOUFLON_GPU`, l'autre façon d'afficher, gardée pour les autres
      # systèmes) : qu'elle tourne sans planter. Un échec ne fait pas
      # échouer la construction.
      - name: Essai d'une minute, dessin sur le GPU
        continue-on-error: true
        run: |
          MOUFLON_ESSAI_CI=1 MOUFLON_ESSAI_DUREE=60 perl -e 'alarm 240; exec @ARGV' \
            bash "tools/essai/Essai de 3 minutes (GPU).command" | tee essai-gpu-console.log
          grep -q "essai terminé" essais/*-gpu/sortie.log

      # Essai de charge : 20, 100, 500 puis 1 000 animaux (`MOUFLON_ESSAI_CHARGE`),
      # pour voir comment Mouflon tient la foule (l'analyse donne chaque
      # palier). Un échec ne fait pas échouer la construction.
      - name: Essai de charge
        continue-on-error: true
        run: |
          MOUFLON_ESSAI_CI=1 perl -e 'alarm 420; exec @ARGV' \
            bash "tools/essai/Essai de charge.command" | tee essai-charge-console.log
          grep -q "essai terminé" essais/*-charge/sortie.log

      # Budgets (docs/architecture.md, 3.7) : la construction échoue si
      # Mouflon lui-même a causé des à-coups, dans l'essai de trois minutes
      # ou l'essai de charge — son fil au travail, sans que la machine
      # virtuelle retienne tout le processus (`analyse.py --budget`).
      - name: Budgets des essais
        run: |
          failed=0
          for dir in essais/*/; do
            case "$dir" in *-gpu/) continue ;; esac
            echo "== $dir"
            python3 tools/essai/analyse.py --budget "$dir" > budget.txt 2>&1 || failed=1
            awk '/^BUDGETS/,0' budget.txt
          done
          exit $failed

      # Vitrine : la fenêtre des réglages en images, en plusieurs langues
      # (`MOUFLON_LANGUE`) — claire, puis avec ses remarques en clair et en
      # sombre — et le texte du menu d'un animal (`vitrine/`). Rien n'y est
      # changé ; un échec ici ne fait pas échouer la construction.
      - name: Vitrine des réglages
        continue-on-error: true
        run: |
          for langue in fr en de ja ru; do
            MOUFLON_VITRINE=vitrine MOUFLON_LANGUE=$langue RUST_LOG=warn,mouflon=info,mouflon_platform=info \
              perl -e 'alarm 90; exec @ARGV' \
              dist/Mouflon.app/Contents/MacOS/mouflon > vitrine-$langue.log 2>&1 || true
          done
          ls -la vitrine

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vitrine
          path: |
            vitrine/
            vitrine-*.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: essai-journal
          path: |
            essai-console.log
            essai-gpu-console.log
            essai-charge-console.log
            essais/

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
